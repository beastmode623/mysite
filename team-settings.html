<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль команды — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}html,body{min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:20}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav{display:flex;gap:20px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.container{max-width:900px;width:100%;margin:auto;padding:64px 24px 100px;flex:1}.back{color:var(--t);text-decoration:none}.hero{padding:38px 0 28px}.hero h1{font-size:44px;margin-bottom:9px}.hero p{color:var(--muted);line-height:1.6}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.section{padding:28px;margin-bottom:18px}.section h2{font-size:23px;margin-bottom:8px}.intro{color:var(--muted);line-height:1.6;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:800}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(3,12,9,.75);color:var(--text);font:inherit;outline:none}textarea{min-height:130px;resize:vertical}.readonly{opacity:.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{padding:11px 15px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,var(--e),var(--t));border:0;color:#04100b}.message{margin-top:14px;color:var(--e);font-size:13px}.warn{margin-top:16px;padding:14px;border-radius:12px;border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.05);color:#d6b66d;font-size:13px;line-height:1.5}.ready{padding:14px;border-radius:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.18);color:var(--e);line-height:1.5}.issues{margin-top:10px;color:var(--muted);line-height:1.55;font-size:13px}.counter{text-align:right;color:var(--muted);font-size:12px;margin-top:6px}footer{flex-shrink:0;padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:34px}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="my-team.html">Моя команда</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a class="back" href="my-team.html">← В управление командой</a><section class="hero"><h1>Профиль команды</h1><p>Капитан может обновлять публичное оформление и проверить готовность состава. Название и тег после одобрения заявки здесь не меняются.</p></section><div id="root"><div class="glass section">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('root');const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s){location.replace('login.html?return=team-settings.html');return}const {data:teams,error}=await window.EsportsAPI.client.from('teams').select('id,tournament_id,name,tag,logo,region,description,registration_status,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(error){root.innerHTML=`<div class="glass section">${esc(error.message)}</div>`;return}if(!teams?.length){root.innerHTML='<div class="glass section">У вас нет команды под управлением.</div>';return}let html='';for(const t of teams){const {data:vr,error:ve}=await window.EsportsAPI.client.rpc('validate_team_roster',{p_team_id:t.id});const v=Array.isArray(vr)?vr[0]:vr;const issues=[...(v?.errors||[]),...(v?.warnings||[])];html+=`<section class="section glass" data-team-block="${esc(t.id)}"><h2>${esc(t.name)} [${esc(t.tag)}]</h2><p class="intro">Публичное оформление команды. Эти данные будут использоваться на странице команды.</p><div class="grid"><div class="field"><label>Название команды</label><input class="readonly" value="${esc(t.name)}" readonly></div><div class="field"><label>Тег</label><input class="readonly" value="${esc(t.tag)}" readonly></div><div class="field"><label>Логотип / короткое обозначение</label><input data-logo maxlength="12" value="${esc(t.logo||'')}" placeholder="Например, TST"></div><div class="field"><label>Регион</label><input data-region maxlength="80" value="${esc(t.region||'')}" placeholder="Например, Россия"></div><div class="field full"><label>Описание команды</label><textarea data-description maxlength="500" placeholder="Кратко о команде, стиле игры или целях">${esc(t.description||'')}</textarea><div class="counter"><span data-count>${(t.description||'').length}</span> / 500</div></div></div><div class="actions"><button class="btn primary" data-save="${esc(t.id)}">Сохранить профиль команды</button><a class="btn" href="team-public.html?id=${encodeURIComponent(t.id)}&tournament=${encodeURIComponent(t.tournament_id)}">Открыть публичную страницу</a></div><div class="message" data-message></div>${ve?`<div class="warn">Не удалось проверить состав: ${esc(ve.message)}</div>`:v?.is_valid?`<div class="ready">Состав проходит структурную проверку.${issues.length?`<div class="issues">${issues.map(esc).join('<br>')}</div>`:''}</div>`:`<div class="warn"><strong>Состав пока не готов.</strong>${issues.length?`<div class="issues">${issues.map(esc).join('<br>')}</div>`:''}</div>`}</section>`}root.innerHTML=html;root.querySelectorAll('[data-description]').forEach(el=>el.addEventListener('input',()=>{el.closest('[data-team-block]').querySelector('[data-count]').textContent=el.value.length}));root.querySelectorAll('[data-save]').forEach(btn=>btn.addEventListener('click',async()=>{const block=btn.closest('[data-team-block]'),msg=block.querySelector('[data-message]');btn.disabled=true;msg.style.color='#6b9b87';msg.textContent='Сохраняем...';const {error}=await window.EsportsAPI.client.rpc('update_my_team_profile',{p_team_id:btn.dataset.save,p_logo:block.querySelector('[data-logo]').value.trim()||null,p_region:block.querySelector('[data-region]').value.trim()||null,p_description:block.querySelector('[data-description]').value.trim()||null});if(error){msg.style.color='#fca5a5';msg.textContent=error.message;btn.disabled=false;return}msg.style.color='#34d399';msg.textContent='Профиль команды сохранён.';btn.disabled=false}))});</script></body></html>
