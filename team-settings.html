<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль команды — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}html,body{min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:20}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav{display:flex;gap:20px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.container{max-width:900px;width:100%;margin:auto;padding:64px 24px 100px;flex:1}.back{color:var(--t);text-decoration:none}.hero{padding:38px 0 28px}.hero h1{font-size:44px;margin-bottom:9px}.hero p,.intro{color:var(--muted);line-height:1.6}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.section{padding:28px;margin-bottom:18px}.section h2{font-size:23px;margin-bottom:8px}.intro{margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:800}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(3,12,9,.75);color:var(--text);font:inherit;outline:none}textarea{min-height:130px;resize:vertical}.readonly{opacity:.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{padding:11px 15px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--e),var(--t));border:0;color:#04100b}.danger{border-color:rgba(248,113,113,.25);color:#fca5a5}.message{margin-top:14px;color:var(--e);font-size:13px}.warn{margin-top:16px;padding:14px;border-radius:12px;border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.05);color:#d6b66d;font-size:13px;line-height:1.5}.ready{padding:14px;border-radius:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.18);color:var(--e);line-height:1.5}.issues{margin-top:10px;color:var(--muted);line-height:1.55;font-size:13px}.counter{text-align:right;color:var(--muted);font-size:12px;margin-top:6px}.reserves{display:grid;gap:10px;margin-top:16px}.reserve{padding:14px;border:1px solid var(--border);border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:14px}.reserve strong{display:block}.state{font-size:12px;color:var(--muted);margin-top:4px}footer{flex-shrink:0;padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:34px}.reserve{flex-direction:column;align-items:flex-start}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="my-team.html">Моя команда</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a class="back" href="my-team.html">← В управление командой</a><section class="hero"><h1>Профиль команды</h1><p>Капитан может обновлять публичное оформление, управлять местами запасных и проверить готовность состава.</p></section><div id="root"><div class="glass section">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function addReserve(team,btn){btn.disabled=true;const {error}=await window.EsportsAPI.client.rpc('captain_add_reserve_slot',{p_team_id:team});if(error){alert(error.message);btn.disabled=false;return}location.reload()}async function removeReserve(id,btn){if(!confirm('Удалить это свободное место запасного игрока?'))return;btn.disabled=true;const {error}=await window.EsportsAPI.client.rpc('captain_remove_reserve_slot',{p_member_id:id});if(error){alert(error.message);btn.disabled=false;return}location.reload()}document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('root'),s=await window.EsportsAPI.getSession().catch(()=>null);if(!s){location.replace('login.html?return=team-settings.html');return}const {data:teams,error}=await window.EsportsAPI.client.from('teams').select('id,tournament_id,name,tag,logo,region,description,registration_status,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(error){root.innerHTML=`<div class="glass section">${esc(error.message)}</div>`;return}if(!teams?.length){root.innerHTML='<div class="glass section">У вас нет команды под управлением.</div>';return}let html='';for(const t of teams){const [{data:vr,error:ve},{data:members,error:me},{data:tr}]=await Promise.all([window.EsportsAPI.client.rpc('validate_team_roster',{p_team_id:t.id}),window.EsportsAPI.client.rpc('get_team_member_management',{p_team_id:t.id}),window.EsportsAPI.client.from('tournaments').select('team_size,max_reserves,status').eq('id',t.tournament_id).maybeSingle()]);const v=Array.isArray(vr)?vr[0]:vr,issues=[...(v?.errors||[]),...(v?.warnings||[])],reserves=(members||[]).filter(x=>x.role==='reserve'),locked=['ongoing','live','finished','cancelled'].includes(tr?.status),maxRes=Number(tr?.max_reserves||0);html+=`<section class="section glass" data-team-block="${esc(t.id)}"><h2>${esc(t.name)} [${esc(t.tag)}]</h2><p class="intro">Публичное оформление команды. Название и тег после одобрения заявки здесь не меняются.</p><div class="grid"><div class="field"><label>Название команды</label><input class="readonly" value="${esc(t.name)}" readonly></div><div class="field"><label>Тег</label><input class="readonly" value="${esc(t.tag)}" readonly></div><div class="field"><label>Логотип / короткое обозначение</label><input data-logo maxlength="12" value="${esc(t.logo||'')}"></div><div class="field"><label>Регион</label><input data-region maxlength="80" value="${esc(t.region||'')}"></div><div class="field full"><label>Описание команды</label><textarea data-description maxlength="500">${esc(t.description||'')}</textarea><div class="counter"><span data-count>${(t.description||'').length}</span> / 500</div></div></div><div class="actions"><button class="btn primary" data-save="${esc(t.id)}">Сохранить профиль команды</button><a class="btn" href="team-public.html?id=${encodeURIComponent(t.id)}&tournament=${encodeURIComponent(t.tournament_id)}">Открыть публичную страницу</a></div><div class="message" data-message></div>${ve?`<div class="warn">Не удалось проверить состав: ${esc(ve.message)}</div>`:v?.is_valid?`<div class="ready">Состав проходит структурную проверку.${issues.length?`<div class="issues">${issues.map(esc).join('<br>')}</div>`:''}</div>`:`<div class="warn"><strong>Состав пока не готов.</strong>${issues.length?`<div class="issues">${issues.map(esc).join('<br>')}</div>`:''}</div>`}</section><section class="section glass"><h2>Запасные игроки</h2><p class="intro">Для этого турнира разрешено до <strong>${maxRes}</strong> запасных. Место можно создать, затем пригласить игрока через «Моя команда». Первый игрок основного состава остаётся капитаном.</p>${me?`<div class="warn">${esc(me.message)}</div>`:`<div class="reserves">${reserves.map(r=>`<div class="reserve"><div><strong>Позиция ${r.roster_position}: ${esc(r.display_name)}</strong><div class="state">${r.linked?'Аккаунт подтверждён':r.invitation_email?`Приглашение: ${esc(r.invitation_email)}`:'Свободное место'}</div></div>${!locked&&!r.linked?`<button class="btn danger" data-remove-reserve="${r.member_id}">Удалить место</button>`:''}</div>`).join('')||'<div class="state">Запасных мест пока нет.</div>'}</div><div class="actions"><button class="btn primary" data-add-reserve="${esc(t.id)}" ${locked||reserves.length>=maxRes?'disabled':''}>Добавить место запасного</button><a class="btn" href="my-team.html">Пригласить игроков</a></div>${locked?'<div class="warn">Состав заблокирован стадией турнира.</div>':''}`}</section>`}root.innerHTML=html;root.querySelectorAll('[data-description]').forEach(el=>el.addEventListener('input',()=>el.closest('[data-team-block]').querySelector('[data-count]').textContent=el.value.length));root.querySelectorAll('[data-save]').forEach(btn=>btn.addEventListener('click',async()=>{const block=btn.closest('[data-team-block]'),msg=block.querySelector('[data-message]');btn.disabled=true;msg.style.color='#6b9b87';msg.textContent='Сохраняем...';const {error}=await window.EsportsAPI.client.rpc('update_my_team_profile',{p_team_id:btn.dataset.save,p_logo:block.querySelector('[data-logo]').value.trim()||null,p_region:block.querySelector('[data-region]').value.trim()||null,p_description:block.querySelector('[data-description]').value.trim()||null});msg.style.color=error?'#fca5a5':'#34d399';msg.textContent=error?error.message:'Профиль команды сохранён.';btn.disabled=false}));root.querySelectorAll('[data-add-reserve]').forEach(b=>b.onclick=()=>addReserve(b.dataset.addReserve,b));root.querySelectorAll('[data-remove-reserve]').forEach(b=>b.onclick=()=>removeReserve(b.dataset.removeReserve,b))});</script></body></html>
