<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход через Steam — Esports Platform</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,#050a08,#0a1a14);color:#f0fdf4}.card{max-width:520px;width:100%;padding:34px;border-radius:24px;background:rgba(12,40,30,.35);border:1px solid rgba(52,211,153,.12);text-align:center}.icon{font-size:34px;color:#2dd4bf}.muted{color:#6b9b87;line-height:1.6}.err{color:#fca5a5}a{color:#2dd4bf}</style></head><body><main class="card"><div class="icon">◉</div><h1>Вход через Steam</h1><p id="state" class="muted">Завершаем безопасный вход...</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const el=document.getElementById('state'),code=new URLSearchParams(location.search).get('code');if(!code){el.className='err';el.innerHTML='Код входа отсутствует.<br><a href="login.html">Вернуться ко входу</a>';return}try{const {data,error}=await EsportsAPI.client.functions.invoke('steam-auth',{body:{mode:'exchange',code}});if(error||!data?.access_token||!data?.refresh_token)throw new Error(data?.error||error?.message||'Не удалось создать сессию');const {error:setErr}=await EsportsAPI.client.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(setErr)throw setErr;history.replaceState(null,'',location.pathname);const target=new URL(data.returnUrl||'profile.html',location.origin);if(target.origin!==location.origin)throw new Error('Недопустимый адрес возврата');location.replace(target.toString())}catch(e){el.className='err';el.innerHTML=`${String(e?.message||e)}<br><a href="login.html">Вернуться ко входу</a>`}});</script></body></html>
