<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Правила турниров — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75)}nav{height:52px;max-width:900px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:var(--e);text-decoration:none}.nav{display:flex;gap:18px}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.container{max-width:850px;margin:auto;padding:60px 24px 100px}.back{color:var(--t);text-decoration:none}.hero{padding:34px 0 24px}.hero h1{font-size:42px;margin-bottom:8px}.hero p{color:var(--muted)}.glass{background:var(--glass);border:1px solid var(--border);border-radius:20px}.form{padding:24px}.field{display:grid;gap:8px;margin-bottom:16px}.field label{font-size:12px;color:var(--muted);font-weight:800}.field select,.field textarea{width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);background:#081510;color:var(--text);font:inherit}.field textarea{min-height:360px;resize:vertical;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 14px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--e),var(--t));border:0;color:#04100b}.meta{color:var(--muted);font-size:13px;line-height:1.5;margin-top:12px}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="admin.html">Админ-панель</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a class="back" href="admin.html">← В админ-панель</a><section class="hero"><h1>Правила турниров</h1><p>Публикуйте только утверждённые правила. Для будущего CS2-турнира поле можно оставить пустым до согласования.</p></section><form id="form" class="glass form"><div class="field"><label>Турнир</label><select id="tournament"></select></div><div class="field"><label>Текст правил</label><textarea id="rules" placeholder="Правила пока не опубликованы"></textarea></div><div class="actions"><button class="btn primary" type="submit">Сохранить правила</button><a id="preview" class="btn" href="tournaments.html">Открыть публичную страницу</a></div><div id="state" class="meta"></div></form></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>let TID=new URLSearchParams(location.search).get('tournament')||null;async function loadRules(){const {data,error}=await window.EsportsAPI.client.rpc('get_public_tournament_rules',{p_tournament_id:TID});const r=Array.isArray(data)?data[0]:data;document.getElementById('rules').value=error?'':(r?.rules_text||'');document.getElementById('preview').href=`tournament-rules.html?id=${encodeURIComponent(TID)}`}document.addEventListener('DOMContentLoaded',async()=>{const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s){location.replace('login.html?return=admin-rules.html');return}const {data:ok}=await window.EsportsAPI.client.rpc('is_tournament_admin');if(!ok){document.querySelector('.container').innerHTML='<div class="glass form">Нет доступа.</div>';return}const items=await window.EsportsAPI.listTournaments();if(!TID||!items.some(x=>x.id===TID))TID=items.find(x=>x.id==='cs2-future-draft')?.id||items[0]?.id;const sel=document.getElementById('tournament');sel.innerHTML=items.map(t=>`<option value="${t.id}">${t.name} · ${t.game||''}</option>`).join('');sel.value=TID;sel.onchange=async()=>{TID=sel.value;history.replaceState(null,'',`admin-rules.html?tournament=${encodeURIComponent(TID)}`);await loadRules()};await loadRules();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const state=document.getElementById('state');state.textContent='Сохраняю...';const {error}=await window.EsportsAPI.client.rpc('admin_update_tournament_rules',{p_tournament_id:TID,p_rules_text:document.getElementById('rules').value});state.textContent=error?error.message:'Правила сохранены.'}});</script></body></html>
