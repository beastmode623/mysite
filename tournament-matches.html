<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матчи турнира — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:var(--e);text-decoration:none}.nav{display:flex;gap:18px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.container{width:100%;max-width:1080px;margin:auto;padding:58px 24px 100px;flex:1}.back{color:var(--t);text-decoration:none}.hero{padding:32px 0}.hero h1{font-size:44px;margin-bottom:8px}.hero p,.meta{color:var(--muted);line-height:1.55}.round{margin-top:24px}.round h2{font-size:22px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.glass{background:var(--glass);border:1px solid var(--border);border-radius:18px}.match{padding:18px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.badge{font-size:11px;color:var(--t);font-weight:800}.team{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-weight:800}.winner{color:var(--e)}.score{font-size:19px}.empty{padding:34px;text-align:center;color:var(--muted)}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero h1{font-size:35px}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="tournaments.html">Турниры</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a id="back" class="back" href="tournaments.html">← К турниру</a><section class="hero"><h1 id="title">Матчи турнира</h1><p id="subtitle">Расписание и результаты.</p></section><div id="root"><div class="glass empty">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id'),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),labels={group:'Групповой этап',playoff:'Плей-офф',final:'Финал',scheduled:'Запланирован',live:'LIVE',finished:'Завершён',cancelled:'Отменён'};document.addEventListener('DOMContentLoaded',async()=>{let root=document.getElementById('root');if(!id){root.innerHTML='<div class="glass empty">Турнир не указан.</div>';return}back.href='tournament-public.html?id='+encodeURIComponent(id);let t=await EsportsAPI.getTournament(id).catch(()=>null);if(t){title.textContent=t.name;subtitle.textContent=`${t.game||''} · Матчи, расписание и результаты`;}let {data,error}=await EsportsAPI.client.rpc('get_public_tournament_matches',{p_tournament_id:id});if(error){root.innerHTML='<div class="glass empty">'+E(error.message)+'</div>';return}let rows=data||[];if(!rows.length){root.innerHTML='<div class="glass empty">Матчи турнира пока не опубликованы.</div>';return}let groups=new Map;rows.forEach(m=>{let k=`${m.stage}|${m.round_order}|${m.round_name}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m)});root.innerHTML=[...groups.values()].map(ms=>{let m0=ms[0];return`<section class="round"><h2>${E(labels[m0.stage]||m0.stage)} · ${E(m0.round_name)}</h2><div class="grid">${ms.map(m=>`<article class="match glass"><div class="top"><div class="meta">Матч ${m.match_order} · BO${m.best_of}${m.scheduled_at?' · '+new Date(m.scheduled_at).toLocaleString('ru-RU'):''}</div><span class="badge">${E(labels[m.status]||m.status)}</span></div><div class="team ${m.winner_team_id===m.team1_id?'winner':''}"><span>${E(m.team1_name||'TBD')}</span><span class="score">${m.team1_score??'–'}</span></div><div class="team ${m.winner_team_id===m.team2_id?'winner':''}"><span>${E(m.team2_name||'TBD')}</span><span class="score">${m.team2_score??'–'}</span></div>${m.notes?`<div class="meta" style="margin-top:12px">${E(m.notes)}</div>`:''}</article>`).join('')}</div></section>`}).join('')});</script></body></html>
