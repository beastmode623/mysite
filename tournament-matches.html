<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матчи турнира — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:var(--e);text-decoration:none}.nav{display:flex;gap:18px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.container{width:100%;max-width:1200px;margin:auto;padding:58px 24px 100px;flex:1}.back{color:var(--t);text-decoration:none}.hero{padding:32px 0}.hero h1{font-size:44px;margin-bottom:8px}.hero p,.meta{color:var(--muted);line-height:1.55}.glass{background:var(--glass);border:1px solid var(--border);border-radius:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--e),var(--t));color:#04100b;border:0;font-weight:800}.panel{display:none}.panel.active{display:block}.round{margin-top:24px}.round h2{font-size:22px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.match{padding:18px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.badge{font-size:11px;color:var(--t);font-weight:800}.team{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-weight:800}.winner{color:var(--e)}.score{font-size:19px}.empty{padding:34px;text-align:center;color:var(--muted)}.bracket-wrap{overflow-x:auto;padding-bottom:10px}.bracket{display:flex;gap:18px;align-items:flex-start;min-width:max-content}.column{width:280px}.column h3{font-size:16px;margin-bottom:10px;color:var(--t)}.bmatch{padding:14px;margin-bottom:12px;position:relative}.bmatch .meta{font-size:11px;margin-bottom:7px}.advance{margin-top:9px;font-size:11px;color:var(--muted)}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero h1{font-size:35px}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="tournaments.html">Турниры</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a id="back" class="back" href="tournaments.html">← К турниру</a><section class="hero"><h1 id="title">Матчи турнира</h1><p id="subtitle">Расписание и результаты.</p></section><div class="tabs"><button class="tab active" data-panel="schedule">Расписание и результаты</button><button class="tab" data-panel="bracket">Сетка</button></div><div id="schedule" class="panel active"><div class="glass empty">Загрузка...</div></div><div id="bracket" class="panel"><div class="glass empty">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id'),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),labels={group:'Групповой этап',playoff:'Плей-офф',final:'Финал',scheduled:'Запланирован',live:'LIVE',finished:'Завершён',cancelled:'Отменён'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});document.addEventListener('DOMContentLoaded',async()=>{let schedule=document.getElementById('schedule'),bracket=document.getElementById('bracket');if(!id){schedule.innerHTML='<div class="glass empty">Турнир не указан.</div>';bracket.innerHTML='';return}back.href='tournament-public.html?id='+encodeURIComponent(id);let t=await EsportsAPI.getTournament(id).catch(()=>null);if(t){title.textContent=t.name;subtitle.textContent=`${t.game||''} · Матчи, расписание и результаты`;}let {data,error}=await EsportsAPI.client.rpc('get_public_tournament_matches',{p_tournament_id:id});if(error){schedule.innerHTML='<div class="glass empty">'+E(error.message)+'</div>';bracket.innerHTML='<div class="glass empty">Не удалось загрузить сетку.</div>';return}let rows=data||[];if(!rows.length){schedule.innerHTML='<div class="glass empty">Матчи турнира пока не опубликованы.</div>';bracket.innerHTML='<div class="glass empty">Сетка появится после публикации матчей.</div>';return}let groups=new Map;rows.forEach(m=>{let k=`${m.stage}|${m.round_order}|${m.round_name}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m)});schedule.innerHTML=[...groups.values()].map(ms=>{let m0=ms[0];return`<section class="round"><h2>${E(labels[m0.stage]||m0.stage)} · ${E(m0.round_name)}</h2><div class="grid">${ms.map(m=>`<article class="match glass"><div class="top"><div class="meta">Матч ${m.match_order} · BO${m.best_of}${m.scheduled_at?' · '+new Date(m.scheduled_at).toLocaleString('ru-RU'):''}</div><span class="badge">${E(labels[m.status]||m.status)}</span></div><div class="team ${m.winner_team_id===m.team1_id?'winner':''}"><span>${E(m.team1_name||'TBD')}</span><span class="score">${m.team1_score??'–'}</span></div><div class="team ${m.winner_team_id===m.team2_id?'winner':''}"><span>${E(m.team2_name||'TBD')}</span><span class="score">${m.team2_score??'–'}</span></div>${m.notes?`<div class="meta" style="margin-top:12px">${E(m.notes)}</div>`:''}</article>`).join('')}</div></section>`}).join('');const bracketRows=rows.filter(m=>m.stage==='playoff'||m.stage==='final');if(!bracketRows.length){bracket.innerHTML='<div class="glass empty">Плей-офф сетка пока не опубликована.</div>';return}let rounds=new Map;bracketRows.sort((a,b)=>a.round_order-b.round_order||a.match_order-b.match_order).forEach(m=>{let k=`${m.round_order}|${m.round_name}`;if(!rounds.has(k))rounds.set(k,[]);rounds.get(k).push(m)});bracket.innerHTML=`<div class="bracket-wrap"><div class="bracket">${[...rounds.values()].map(ms=>`<section class="column"><h3>${E(ms[0].round_name)}</h3>${ms.map(m=>{let next=rows.find(x=>x.match_id===m.next_match_id);return`<article class="bmatch glass"><div class="meta">Матч ${m.match_order} · BO${m.best_of} · ${E(labels[m.status]||m.status)}</div><div class="team ${m.winner_team_id===m.team1_id?'winner':''}"><span>${E(m.team1_name||'TBD')}</span><span>${m.team1_score??'–'}</span></div><div class="team ${m.winner_team_id===m.team2_id?'winner':''}"><span>${E(m.team2_name||'TBD')}</span><span>${m.team2_score??'–'}</span></div>${next?`<div class="advance">Победитель → ${E(next.round_name)}, матч ${next.match_order}, слот ${m.next_match_slot}</div>`:''}</article>`}).join('')}</section>`).join('')}</div></div>`});</script></body></html>
