<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игровой профиль — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:20}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav-links{display:flex;gap:24px;list-style:none;align-items:center}.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.profile-link,.logout-link{display:none}.btn-login{padding:7px 20px;border:1px solid var(--border);border-radius:999px;color:var(--text)!important}.container{max-width:960px;margin:auto;padding:64px 24px 100px}.back{color:var(--t);text-decoration:none}.hero{padding:42px 0 30px}.eyebrow{font-size:12px;color:var(--t);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.hero h1{font-size:46px;margin-bottom:10px}.hero p{color:var(--muted);line-height:1.6}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.membership{padding:26px;margin-bottom:16px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.team{font-size:26px;font-weight:800}.meta{color:var(--muted);margin-top:6px;line-height:1.5}.role{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(45,212,191,.1);color:var(--t);white-space:nowrap}.captain{background:rgba(52,211,153,.14);color:var(--e)}.reserve{background:rgba(245,158,11,.12);color:#fbbf24}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{padding:11px 15px;border-radius:11px;text-decoration:none;font-weight:800;font-size:13px}.primary{background:linear-gradient(135deg,var(--e),var(--t));color:#04100b}.secondary{border:1px solid var(--border);color:var(--text)}.permissions{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}.permissions h3{font-size:16px;margin-bottom:10px}.permissions p{color:var(--muted);line-height:1.6;font-size:14px}.empty{padding:40px;text-align:center;color:var(--muted);line-height:1.6}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:650px){.hero h1{font-size:34px}.head{flex-direction:column}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="teams.html">Статистика</a></li><li class="profile-link"><a href="profile.html">Профиль</a></li><li class="login-link"><a class="btn-login" href="login.html">Вход</a></li><li class="logout-link"><a class="btn-login" href="#" onclick="logout();return false">Выйти</a></li></ul></nav></header><main class="container"><a class="back" href="profile.html">← В профиль</a><section class="hero"><div class="eyebrow">Участник команды</div><h1>Игровой профиль</h1><p>Здесь отображаются команды и турниры, в которых ваш аккаунт подтверждён как участник состава.</p></section><div id="memberships"><div class="glass empty">Загрузка участия...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const roleText={captain:'Капитан',main:'Основной игрок',reserve:'Запасной игрок'};
const statusText={pending:'На рассмотрении',approved:'Одобрена',rejected:'Отклонена'};
document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('memberships');const session=await window.EsportsAPI.getSession().catch(()=>null);if(!session){location.replace('login.html?return=my-player.html');return}const {data,error}=await window.EsportsAPI.client.rpc('get_my_team_memberships');if(error){root.innerHTML=`<div class="glass empty">${esc(error.message)}</div>`;return}if(!data?.length){root.innerHTML='<div class="glass empty"><strong>Аккаунт пока не связан с составом команды.</strong><br>Если капитан указал в заявке тот же email, который используется в вашем аккаунте, связь появится автоматически после одобрения заявки.</div>';return}root.innerHTML=data.map(m=>{const teamHref=`team-public.html?id=${encodeURIComponent(m.team_id)}&tournament=${encodeURIComponent(m.tournament_id)}`;const tournamentHref=m.tournament_id==='dota2-winter-2026'?`tournament.html?id=${encodeURIComponent(m.tournament_id)}`:(m.tournament_status==='draft'?`tournament-draft.html?id=${encodeURIComponent(m.tournament_id)}`:`tournament-public.html?id=${encodeURIComponent(m.tournament_id)}`);const roleClass=m.role==='captain'?'captain':m.role==='reserve'?'reserve':'';const rights=m.role==='captain'?'Вы управляете командой и заявками. Изменения состава будут доступны через отдельный контролируемый процесс.':'Вы видите свою команду, турнир и статус участия. Изменять название команды, состав или решения по заявке может только капитан.';return `<section class="membership glass"><div class="head"><div><div class="team">${esc(m.team_name)} [${esc(m.team_tag)}]</div><div class="meta">${esc(m.tournament_name)} · ${esc(m.game)}<br>${esc(m.display_name)} · позиция ${m.roster_position} · заявка: ${esc(statusText[m.registration_status]||m.registration_status)}</div></div><span class="role ${roleClass}">${esc(roleText[m.role]||m.role)}</span></div><div class="actions"><a class="btn primary" href="${teamHref}">Страница команды</a><a class="btn secondary" href="${tournamentHref}">Турнир</a>${m.is_captain?'<a class="btn secondary" href="my-team.html">Управление командой</a>':''}</div><div class="permissions"><h3>Ваши возможности</h3><p>${rights}</p></div></section>`}).join('')});
</script></body></html>
