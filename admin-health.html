<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка системы — Esports Platform</title><style>*{box-sizing:border-box}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:10}nav{min-height:52px;max-width:1100px;margin:auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{color:var(--e);font-size:21px;font-weight:800;text-decoration:none}.links{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}.links a{color:var(--muted);font-size:13px;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:60px 24px 100px}.eyebrow{color:var(--t);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:44px;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.toolbar{padding:20px;margin:26px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar select,.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:#071610;color:var(--text);font:inherit}.toolbar select{min-width:280px}.btn{cursor:pointer;background:linear-gradient(135deg,var(--e),var(--t));color:#04100b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:20px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:30px;color:var(--e);margin-top:6px}.panel{padding:24px;margin-top:16px}.panel h2{margin-top:0}.security{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.check{padding:16px;border-radius:14px;border:1px solid var(--border);background:rgba(52,211,153,.03)}.check strong{display:block;font-size:22px;margin-top:6px}.ok{color:var(--e)}.bad{color:#fca5a5}.warn{color:#fcd34d}ul{line-height:1.7;padding-left:22px}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:850px){.grid,.security{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.security{grid-template-columns:1fr}.hero h1{font-size:34px}.toolbar select{min-width:0;width:100%}}</style></head><body><header><nav><a class="logo" href="admin.html">Esports Admin</a><div class="links"><a href="admin.html?tab=dashboard">Дашборд</a><a href="admin-health.html">Проверка системы</a><a id="lifecycleLink" href="admin-lifecycle.html">Жизненный цикл</a><a href="admin-cms.html">CMS</a><a href="admin-new-tournament.html">Создать турнир</a><a href="profile.html">Профиль</a></div></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">Production hardening</div><h1>Проверка системы</h1><p class="muted">Состояние backend, безопасность и preflight выбранного турнира перед запуском.</p></section><div class="toolbar glass"><select id="tournament"><option value="">Вся система</option></select><button class="btn" id="refresh">Проверить</button></div><div id="root" class="panel glass">Загрузка...</div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function secCard(label,value){const n=Number(value||0),ok=n===0;return `<div class="check"><span class="muted">${E(label)}</span><strong class="${ok?'ok':'bad'}">${n}</strong></div>`}async function load(){const id=document.getElementById('tournament').value||null,root=document.getElementById('root');document.getElementById('lifecycleLink').href='admin-lifecycle.html'+(id?'?tournament='+encodeURIComponent(id):'');root.textContent='Проверка...';const {data:h,error:he}=await window.EsportsAPI.client.rpc('admin_system_health',{p_tournament_id:id});if(he){root.innerHTML='<span class="bad">'+E(he.message)+'</span>';return}let pf=null;if(id){const {data,error}=await window.EsportsAPI.client.rpc('admin_tournament_preflight',{p_tournament_id:id});if(error){root.innerHTML='<span class="bad">'+E(error.message)+'</span>';return}pf=data?.[0]}const s=h.security||{};root.innerHTML=`<div class="grid"><div class="stat glass"><span>Database</span><b>${E(h.database)}</b></div><div class="stat glass"><span>Одобрено команд</span><b>${Number(h.approved_teams||0)}</b></div><div class="stat glass"><span>Заявок pending</span><b>${Number(h.pending_applications||0)}</b></div><div class="stat glass"><span>Изменений состава</span><b>${Number(h.pending_roster_changes||0)}</b></div></div><section class="panel"><h2 class="${s.ok?'ok':'bad'}">${s.ok?'Безопасность: критичных проблем нет':'Безопасность требует внимания'}</h2><p class="muted">Автоматическая проверка RLS, прямых клиентских записей и SECURITY DEFINER RPC.</p><div class="security">${secCard('Таблицы без RLS',s.rls_missing)}${secCard('Неожиданные anon SECURITY DEFINER',s.unexpected_anon_security_definer)}${secCard('Прямые client write grants',s.direct_client_write_grants)}${secCard('SECURITY DEFINER без search_path',s.mutable_search_path_security_definer)}</div></section>${pf?`<section class="panel"><h2 class="${pf.can_start?'ok':'bad'}">${pf.can_start?'Турнир готов к старту':'Старт заблокирован'}</h2><p class="muted">Команд: ${pf.approved_teams} · заявок pending: ${pf.pending_applications} · изменений состава: ${pf.pending_roster_changes}</p><h3>Ошибки</h3>${pf.errors?.length?`<ul class="bad">${pf.errors.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<p class="ok">Критических ошибок нет.</p>'}<h3>Предупреждения</h3>${pf.warnings?.length?`<ul class="warn">${pf.warnings.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<p class="ok">Предупреждений нет.</p>'}</section>`:''}`;}document.addEventListener('DOMContentLoaded',async()=>{const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s)return location.replace('login.html?return=admin-health.html');const {data:ok,error}=await window.EsportsAPI.client.rpc('is_tournament_admin');if(error||!ok)return location.replace('profile.html');const {data}=await window.EsportsAPI.client.from('tournaments').select('id,name,status').order('created_at',{ascending:false});const sel=document.getElementById('tournament'),q=new URLSearchParams(location.search).get('tournament');(data||[]).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=`${t.name} · ${t.status}`;sel.appendChild(o)});if(q)sel.value=q;document.getElementById('refresh').onclick=load;sel.onchange=load;load()});</script></body></html>
