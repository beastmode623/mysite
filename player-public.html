<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль игрока — Esports Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:20}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav-links{display:flex;gap:24px;list-style:none;align-items:center}.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.profile-link,.logout-link{display:none}.btn-login{padding:7px 20px;border:1px solid var(--border);border-radius:999px;color:var(--text)!important}.container{max-width:900px;margin:auto;padding:64px 24px 100px}.back{color:var(--t);text-decoration:none}.glass{background:var(--glass);border:1px solid var(--border);border-radius:24px}.hero{padding:38px;margin-top:28px;display:flex;gap:24px;align-items:center}.avatar{width:112px;height:112px;border-radius:50%;background:rgba(45,212,191,.12);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--t);font-size:36px;font-weight:800;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{color:var(--t);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.hero h1{font-size:42px;margin-bottom:10px}.meta{color:var(--muted);line-height:1.6}.section{padding:28px;margin-top:18px}.section h2{font-size:23px;margin-bottom:12px}.facts{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:rgba(52,211,153,.07);border:1px solid var(--border);color:var(--muted);font-size:13px}.teams{display:grid;gap:12px}.team{padding:17px;border-radius:15px;border:1px solid var(--border);background:rgba(52,211,153,.035);display:flex;justify-content:space-between;gap:16px;align-items:center}.team a{color:var(--text);text-decoration:none;font-weight:800}.team small{display:block;color:var(--muted);margin-top:5px}.role{color:var(--t);font-size:13px;white-space:nowrap}.steam{display:inline-block;margin-top:16px;color:var(--t);text-decoration:none}.empty{padding:38px;text-align:center;color:var(--muted);line-height:1.6}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start;padding:28px}.hero h1{font-size:34px}.team{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><nav><a class="logo" href="index.html">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="teams.html">Статистика</a></li><li class="profile-link"><a href="profile.html">Профиль</a></li><li class="login-link"><a class="btn-login" href="login.html">Вход</a></li><li class="logout-link"><a class="btn-login" href="#" onclick="logout();return false">Выйти</a></li></ul></nav></header>
<main class="container"><a class="back" href="javascript:history.back()">← Назад</a><div id="root"><div class="glass empty">Загрузка профиля...</div></div></main>
<footer>© 2026 Esports Platform. Все права защищены.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const roleText={captain:'Капитан',main:'Основной состав',reserve:'Запасной игрок'};
function teamUrl(m){return `team-public.html?id=${encodeURIComponent(m.team_id)}&tournament=${encodeURIComponent(m.tournament_id)}`}
document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('root');const id=new URLSearchParams(location.search).get('id');if(!id){root.innerHTML='<div class="glass empty">Игрок не указан.</div>';return}const session=await window.EsportsAPI.getSession().catch(()=>null);if(!session){location.replace(`login.html?return=${encodeURIComponent(location.pathname+location.search)}`);return}const [{data:profile,error:pe},{data:memberships,error:me}]=await Promise.all([window.EsportsAPI.client.rpc('get_public_player_profile',{p_user_id:id}),window.EsportsAPI.client.rpc('get_public_player_memberships',{p_user_id:id})]);if(pe||me){root.innerHTML=`<div class="glass empty">${esc(pe?.message||me?.message||'Не удалось загрузить профиль.')}</div>`;return}const p=Array.isArray(profile)?profile[0]:profile;if(!p){root.innerHTML='<div class="glass empty"><strong>Профиль недоступен.</strong><br>Игрок мог закрыть публичный просмотр профиля.</div>';return}document.title=`${p.nickname} — Esports Platform`;const avatar=p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc((p.nickname||'?').charAt(0).toUpperCase());const place=[p.city,p.country].filter(Boolean).join(', ');const since=p.member_since?new Date(p.member_since).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):'';const teams=(memberships||[]);root.innerHTML=`<section class="hero glass"><div class="avatar">${avatar}</div><div><div class="eyebrow">Профиль игрока</div><h1>${esc(p.nickname)}</h1><div class="meta">${place?esc(place):'Местоположение не указано'}${since?`<br>На платформе с ${esc(since)}`:''}</div>${p.steam_profile_url?`<a class="steam" href="${esc(p.steam_profile_url)}" target="_blank" rel="noopener noreferrer">Открыть Steam-профиль ↗</a>`:''}</div></section><section class="section glass"><h2>Участие в турнирах</h2>${teams.length?`<div class="teams">${teams.map(m=>`<div class="team"><div><a href="${teamUrl(m)}">${esc(m.team_name)} [${esc(m.team_tag)}]</a><small>${esc(m.tournament_name)} · ${esc(m.game)} · позиция ${m.roster_position}</small></div><div class="role">${esc(roleText[m.role]||m.role)}</div></div>`).join('')}</div>`:'<div class="empty">Подтверждённых участий в одобренных командах пока нет.</div>'}</section><section class="section glass"><h2>Конфиденциальность</h2><div class="facts"><span class="pill">Email скрыт</span><span class="pill">Телефон скрыт</span><span class="pill">Дата рождения скрыта</span></div></section>`});
</script>
</body></html>
