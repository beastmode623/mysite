<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль игрока — Esports Platform</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,#050a08,#0a1a14);color:#f0fdf4;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:64px 24px 100px}a{color:#2dd4bf;text-decoration:none}.glass{background:rgba(12,40,30,.35);border:1px solid rgba(52,211,153,.12);border-radius:24px}.hero{padding:36px;margin-top:28px;display:flex;gap:24px;align-items:center}.avatar{width:112px;height:112px;border-radius:50%;overflow:hidden;background:rgba(45,212,191,.12);display:flex;align-items:center;justify-content:center;font-size:38px;color:#2dd4bf;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{color:#2dd4bf;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:42px;margin:7px 0}.game-nick{font-size:18px;color:#5eead4}.muted{color:#6b9b87;line-height:1.6}.section{padding:28px;margin-top:18px}.facts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.pill{padding:8px 12px;border-radius:999px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.12);color:#9cc9b6;font-size:13px}.bio{white-space:pre-wrap;line-height:1.65}.teams{display:grid;gap:12px}.team{padding:17px;border:1px solid rgba(52,211,153,.12);border-radius:15px}.team strong{color:#f0fdf4}.role{float:right;color:#2dd4bf}.empty{text-align:center;padding:40px;color:#6b9b87}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:34px}}</style></head><body><main class="wrap"><a href="javascript:history.back()">← Назад</a><div id="root"><div class="glass empty">Загрузка профиля...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),roles={captain:'Капитан',main:'Основной состав',reserve:'Запасной игрок'};document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('root');if(!id)return root.innerHTML='<div class="glass empty">Игрок не указан.</div>';const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s)return location.replace(`login.html?return=${encodeURIComponent(location.pathname+location.search)}`);const [{data,error},{data:ms,error:me}]=await Promise.all([window.EsportsAPI.client.rpc('get_public_player_profile',{p_user_id:id}),window.EsportsAPI.client.rpc('get_public_player_memberships',{p_user_id:id})]);if(error||me)return root.innerHTML=`<div class="glass empty">${E(error?.message||me?.message)}</div>`;const p=Array.isArray(data)?data[0]:data;if(!p)return root.innerHTML='<div class="glass empty">Профиль приватный или недоступен.</div>';const place=[p.city,p.country].filter(Boolean).join(', ')||'Местоположение не указано',av=p.avatar_url?`<img src="${E(p.avatar_url)}" alt="">`:E((p.nickname||'?')[0]),since=p.member_since?new Date(p.member_since).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):'';root.innerHTML=`<section class="hero glass"><div class="avatar">${av}</div><div><div class="eyebrow">Профиль игрока</div><h1>${E(p.nickname)}</h1>${p.game_nickname?`<div class="game-nick">${E(p.game_nickname)}</div>`:''}<div class="muted">${E(place)}${since?` · на платформе с ${E(since)}`:''}</div><div class="facts">${p.primary_game?`<span class="pill">${E(p.primary_game)}</span>`:''}${p.game_role?`<span class="pill">${E(p.game_role)}</span>`:''}${p.gaming_experience_years!=null?`<span class="pill">Опыт: ${p.gaming_experience_years} лет</span>`:''}</div>${p.steam_profile_url?`<p><a href="${E(p.steam_profile_url)}" target="_blank" rel="noopener noreferrer">Steam-профиль ↗</a></p>`:''}${p.is_own_profile?'<p><a href="player-edit.html">Редактировать игровой профиль →</a></p>':''}</div></section>${p.bio?`<section class="section glass"><h2>Об игроке</h2><div class="bio muted">${E(p.bio)}</div></section>`:''}<section class="section glass"><h2>Команды и турниры</h2>${(ms||[]).length?`<div class="teams">${ms.map(m=>`<div class="team"><span class="role">${E(roles[m.role]||m.role)}</span><a href="team-public.html?id=${encodeURIComponent(m.team_id)}&tournament=${encodeURIComponent(m.tournament_id)}"><strong>${E(m.team_name)}</strong></a><div class="muted">${E(m.tournament_name)} · ${E(m.game)} · позиция ${m.roster_position}</div></div>`).join('')}</div>`:'<div class="muted">Подтверждённых участий пока нет.</div>'}</section><section class="section glass"><h2>Конфиденциальность</h2><div class="facts"><span class="pill">Email скрыт</span><span class="pill">Телефон скрыт</span><span class="pill">Дата рождения скрыта</span></div></section>`});</script></body></html>
