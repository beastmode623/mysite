<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль игрока — Esports Platform</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,#050a08,#0a1a14);color:#f0fdf4;min-height:100vh;display:flex;flex-direction:column}header{border-bottom:1px solid rgba(52,211,153,.12);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:10}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:#34d399;text-decoration:none}.nav{display:flex;gap:20px;align-items:center}.nav a{font-size:13px;color:#6b9b87;text-decoration:none}.wrap{width:100%;max-width:980px;margin:auto;padding:58px 24px 100px;flex:1}a{color:#2dd4bf;text-decoration:none}.glass{background:rgba(12,40,30,.35);border:1px solid rgba(52,211,153,.12);border-radius:24px}.hero{padding:36px;margin-top:28px;display:flex;gap:24px;align-items:center}.avatar{width:112px;height:112px;border-radius:50%;overflow:hidden;background:rgba(45,212,191,.12);display:flex;align-items:center;justify-content:center;font-size:38px;color:#2dd4bf;font-weight:900;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{color:#2dd4bf;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:42px;margin:7px 0}.game-nick{font-size:18px;color:#5eead4}.muted{color:#6b9b87;line-height:1.6}.section{padding:28px;margin-top:18px}.section h2{margin:0 0 8px}.facts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.pill{padding:8px 12px;border-radius:999px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.12);color:#9cc9b6;font-size:13px}.bio{white-space:pre-wrap;line-height:1.65}.teams,.history{display:grid;gap:12px}.team,.history-item{padding:17px;border:1px solid rgba(52,211,153,.12);border-radius:15px}.team strong{color:#f0fdf4}.role{float:right;color:#2dd4bf}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{padding:16px;border-radius:15px;border:1px solid rgba(52,211,153,.12);background:rgba(52,211,153,.035)}.stat strong{display:block;font-size:24px;color:#f0fdf4}.stat span{font-size:11px;color:#6b9b87;text-transform:uppercase}.result{font-weight:900}.win{color:#34d399}.loss{color:#f87171}.history-top{display:flex;justify-content:space-between;gap:12px}.history-meta{font-size:13px;color:#6b9b87;margin-top:5px}.achievements{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.achievement{padding:8px 11px;border-radius:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.18);color:#fbbf24;font-size:12px;font-weight:800}.empty{text-align:center;padding:28px;color:#6b9b87}footer{padding:36px;text-align:center;color:#6b9b87;font-size:12px;border-top:1px solid rgba(52,211,153,.12)}@media(max-width:760px){.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:34px}.stats{grid-template-columns:repeat(2,1fr)}.nav{gap:12px}.history-top{flex-direction:column}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="tournaments.html">Турниры</a><a href="teams.html">Статистика</a><a href="profile.html">Профиль</a></div></nav></header><main class="wrap"><a href="javascript:history.back()">← Назад</a><div id="root"><div class="glass empty">Загрузка профиля...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),roles={captain:'Капитан',main:'Основной состав',reserve:'Запасной игрок'},stage={group:'Групповой этап',playoff:'Плей-офф',final:'Финал'};const score=(a,b)=>a==null||b==null?'—':`${a}:${b}`;document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('root');if(!id)return root.innerHTML='<div class="glass empty">Игрок не указан.</div>';const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s)return location.replace(`login.html?return=${encodeURIComponent(location.pathname+location.search)}`);const [{data,error},{data:ms,error:me},{data:stats,error:se},{data:matches,error:he},{data:tournaments,error:te}]=await Promise.all([EsportsAPI.client.rpc('get_public_player_profile',{p_user_id:id}),EsportsAPI.client.rpc('get_public_player_memberships',{p_user_id:id}),EsportsAPI.client.rpc('get_public_player_statistics',{p_user_id:id}),EsportsAPI.client.rpc('get_public_player_match_history',{p_user_id:id,p_limit:20,p_offset:0}),EsportsAPI.client.rpc('get_public_player_tournament_history',{p_user_id:id})]);if(error||me||se||he||te)return root.innerHTML=`<div class="glass empty">${E(error?.message||me?.message||se?.message||he?.message||te?.message)}</div>`;const p=Array.isArray(data)?data[0]:data;if(!p)return root.innerHTML='<div class="glass empty">Профиль приватный или недоступен.</div>';const st=stats||{},place=[p.city,p.country].filter(Boolean).join(', ')||'Местоположение не указано',av=p.avatar_url?`<img src="${E(p.avatar_url)}" alt="">`:E((p.nickname||'?')[0]),since=p.member_since?new Date(p.member_since).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):'';const achievements=[];if(st.titles>0)achievements.push(`🏆 Чемпион · ${st.titles}`);if(st.podiums>0)achievements.push(`🥉 Призовые места · ${st.podiums}`);if(st.matches_played>=10)achievements.push(`⚔ Матчей · ${st.matches_played}`);root.innerHTML=`<section class="hero glass"><div class="avatar">${av}</div><div><div class="eyebrow">Профиль игрока</div><h1>${E(p.nickname)}</h1>${p.game_nickname?`<div class="game-nick">${E(p.game_nickname)}</div>`:''}<div class="muted">${E(place)}${since?` · на платформе с ${E(since)}`:''}</div><div class="facts">${p.primary_game?`<span class="pill">${E(p.primary_game)}</span>`:''}${p.game_role?`<span class="pill">${E(p.game_role)}</span>`:''}${p.gaming_experience_years!=null?`<span class="pill">Опыт: ${p.gaming_experience_years} лет</span>`:''}</div>${p.steam_profile_url?`<p><a href="${E(p.steam_profile_url)}" target="_blank" rel="noopener noreferrer">Steam-профиль ↗</a></p>`:''}${p.is_own_profile?'<p><a href="player-edit.html">Редактировать игровой профиль →</a></p>':''}</div></section>${p.bio?`<section class="section glass"><h2>Об игроке</h2><div class="bio muted">${E(p.bio)}</div></section>`:''}<section class="section glass"><h2>Статистика</h2><div class="muted">Статистика считается по подтверждённому основному составу, зафиксированному на момент начала матча.</div><div class="stats"><div class="stat"><strong>${st.matches_played||0}</strong><span>Матчи</span></div><div class="stat"><strong>${st.wins||0}–${st.losses||0}</strong><span>Победы / поражения</span></div><div class="stat"><strong>${st.win_rate||0}%</strong><span>Win rate</span></div><div class="stat"><strong>${st.maps_won||0}:${st.maps_lost||0}</strong><span>Карты</span></div><div class="stat"><strong>${st.tournaments_played||0}</strong><span>Турниры</span></div><div class="stat"><strong>${st.titles||0}</strong><span>Титулы</span></div><div class="stat"><strong>${st.podiums||0}</strong><span>Подиумы</span></div><div class="stat"><strong>${st.best_place||'—'}</strong><span>Лучшее место</span></div></div>${achievements.length?`<div class="achievements">${achievements.map(x=>`<span class="achievement">${E(x)}</span>`).join('')}</div>`:''}</section><section class="section glass"><h2>История матчей</h2><div class="history">${(matches||[]).length?(matches||[]).map(m=>`<div class="history-item"><div class="history-top"><div><strong>${E(m.team_name)} vs ${E(m.opponent_name)}</strong><div class="history-meta">${E(m.tournament_name)} · ${E(stage[m.stage]||m.stage)} · ${E(m.round_name)} · BO${m.best_of}</div></div><div class="result ${m.result==='win'?'win':m.result==='loss'?'loss':''}">${m.result==='win'?'Победа':m.result==='loss'?'Поражение':E(m.result)} · ${score(m.team_score,m.opponent_score)}</div></div></div>`).join(''):'<div class="muted">Завершённых матчей пока нет.</div>'}</div></section><section class="section glass"><h2>История турниров</h2><div class="history">${(tournaments||[]).length?(tournaments||[]).map(t=>`<div class="history-item"><div class="history-top"><div><strong>${E(t.tournament_name)}</strong><div class="history-meta">${E(t.game)} · ${E(t.team_name)} · ${t.matches_played} матчей · ${t.wins}–${t.losses}</div></div><div>${t.place?`<span class="achievement">${t.place} место</span>`:'<span class="pill">'+E(t.tournament_status)+'</span>'}</div></div></div>`).join(''):'<div class="muted">История появится после сыгранных матчей.</div>'}</div></section><section class="section glass"><h2>Текущие команды</h2>${(ms||[]).length?`<div class="teams">${ms.map(m=>`<div class="team"><span class="role">${E(roles[m.role]||m.role)}</span><a href="team-public.html?id=${encodeURIComponent(m.team_id)}&tournament=${encodeURIComponent(m.tournament_id)}"><strong>${E(m.team_name)}</strong></a><div class="muted">${E(m.tournament_name)} · ${E(m.game)} · позиция ${m.roster_position}</div></div>`).join('')}</div>`:'<div class="muted">Подтверждённых участий пока нет.</div>'}</section><section class="section glass"><h2>Конфиденциальность</h2><div class="facts"><span class="pill">Email скрыт</span><span class="pill">Телефон скрыт</span><span class="pill">Дата рождения скрыта</span></div></section>`});</script></body></html>
