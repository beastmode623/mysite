<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика — Esports Platform</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,#050a08,#0a1a14);color:#f0fdf4;min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:70px 24px 100px}.hero{text-align:center}.hero h1{font-size:52px;margin:8px}.muted{color:#6b9b87}.tabs,.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px}.tab,.filter{padding:9px 18px;border-radius:999px;border:1px solid rgba(52,211,153,.12);background:rgba(12,40,30,.35);color:#9cc9b6;cursor:pointer}.active{background:#34d399;color:#04100b;font-weight:800}.search{display:block;max-width:520px;margin:20px auto}.search input{width:100%;padding:13px;border-radius:13px;border:1px solid rgba(52,211,153,.12);background:#071610;color:#f0fdf4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:23px;border:1px solid rgba(52,211,153,.12);border-radius:20px;background:rgba(12,40,30,.35);color:inherit;text-decoration:none}.head{display:flex;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;background:#2dd4bf;color:#04100b;display:flex;align-items:center;justify-content:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:21px;font-weight:800}.gameNick{color:#5eead4}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.badge{padding:6px 9px;border-radius:8px;background:rgba(45,212,191,.08);color:#2dd4bf;font-size:11px}.bottom{margin-top:17px;padding-top:14px;border-top:1px solid rgba(52,211,153,.12);color:#6b9b87;font-size:13px}.empty{grid-column:1/-1;text-align:center;padding:40px}.count{text-align:center;color:#6b9b87;margin:18px}.panel{display:none}.panel.active{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><main class="wrap"><section class="hero"><div class="muted">Статистика</div><h1>Команды и игроки</h1></section><div class="tabs"><button class="tab active" data-tab="teams">Команды</button><button class="tab" data-tab="players">Игроки</button></div><label class="search"><input id="q" placeholder="Найти команду по названию"></label><div class="filters"><button class="filter active" data-game="all">Все</button><button class="filter" data-game="dota2">Dota 2</button><button class="filter" data-game="cs2">CS2</button></div><section id="teams" class="panel active"><div id="tc" class="count"></div><div id="tg" class="grid"></div></section><section id="players" class="panel"><div id="pc" class="count"></div><div id="pg" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>let tab='teams',game='all',search='',timer;const gm={all:null,dota2:'dota 2',cs2:'cs2'},E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),roles={captain:'Капитан',main:'Основной игрок',reserve:'Запасной'};async function loadTeams(){const {data,error}=await window.EsportsAPI.client.rpc('get_public_team_directory',{p_search:search||null,p_game:gm[game]});tc.textContent=error?'':`Найдено команд: ${(data||[]).length}`;tg.innerHTML=error?`<div class="empty">${E(error.message)}</div>`:(data||[]).map(t=>`<a class="card" href="${t.tournament_id==='dota2-winter-2026'?`team.html?team=${encodeURIComponent(t.team_id)}`:`team-public.html?id=${encodeURIComponent(t.team_id)}&tournament=${encodeURIComponent(t.tournament_id)}`}"><div class="name">${E(t.team_name)}</div><div class="muted">${E(t.region||'Регион не указан')} · ${E(t.tournament_name)}</div><div class="badges"><span class="badge">${E(t.game)}</span></div></a>`).join('')||'<div class="empty">Команды не найдены.</div>'}async function loadPlayers(){const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s){pg.innerHTML='<div class="empty">Войдите, чтобы просматривать игроков.</div>';return}const {data,error}=await window.EsportsAPI.client.rpc('get_public_player_directory',{p_search:search||null,p_game:gm[game]});pc.textContent=error?'':`Найдено игроков: ${(data||[]).length}`;pg.innerHTML=error?`<div class="empty">${E(error.message)}</div>`:(data||[]).map(p=>{const av=p.avatar_url?`<img src="${E(p.avatar_url)}">`:E((p.nickname||'?')[0]),place=[p.city,p.country].filter(Boolean).join(', ')||'Локация не указана';return `<a class="card" href="player-public.html?id=${p.profile_id}"><div class="head"><div class="avatar">${av}</div><div><div class="name">${E(p.nickname)}</div>${p.game_nickname?`<div class="gameNick">${E(p.game_nickname)}</div>`:''}<div class="muted">${E(place)}</div></div></div><div class="badges">${p.primary_game?`<span class="badge">${E(p.primary_game)}</span>`:''}${p.game_role?`<span class="badge">${E(p.game_role)}</span>`:''}${p.gaming_experience_years!=null?`<span class="badge">Опыт ${p.gaming_experience_years} лет</span>`:''}</div><div class="bottom">${p.current_team_name?`${E(p.current_team_name)} · ${E(roles[p.team_role]||p.team_role)}`:'Без подтверждённой команды'}</div></a>`}).join('')||'<div class="empty">Игроки не найдены.</div>'}function refresh(){tab==='teams'?loadTeams():loadPlayers()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;document.getElementById(tab).classList.add('active');q.placeholder=tab==='teams'?'Найти команду по названию':'Найти игрока по нику или игровому нику';refresh()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');game=b.dataset.game;refresh()});q.oninput=e=>{search=e.target.value.trim();clearTimeout(timer);timer=setTimeout(refresh,220)};document.addEventListener('DOMContentLoaded',loadTeams);</script></body></html>
