<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--tl:#5eead4;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}html,body{min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{background:rgba(5,10,8,.72);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}nav{max-width:1080px;height:52px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav-links{display:flex;gap:24px;list-style:none;align-items:center}.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.profile-link,.logout-link{display:none}.btn-login{padding:7px 20px;border:1px solid var(--border);border-radius:999px;color:var(--text)!important}.container{max-width:1080px;width:100%;margin:auto;padding:72px 24px 100px;flex:1}.hero{text-align:center;margin-bottom:34px}.eyebrow{font-size:13px;color:var(--t);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.hero h1{font-size:54px;line-height:1.05;margin-bottom:12px}.hero p{color:var(--muted);font-size:18px}.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}.tab{padding:11px 28px;border-radius:999px;border:1px solid var(--border);background:var(--glass);color:var(--muted);font:inherit;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--e),var(--t));color:#04100b;border-color:transparent;font-weight:800}.controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.search{width:min(520px,100%);position:relative}.search input{width:100%;padding:13px 16px 13px 42px;border-radius:14px;border:1px solid var(--border);background:rgba(7,22,16,.8);color:var(--text);font:inherit;outline:none}.search:before{content:'⌕';position:absolute;left:15px;top:9px;color:var(--t);font-size:24px}.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}.filter{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}.filter.active{background:rgba(52,211,153,.12);color:var(--e);border-color:rgba(52,211,153,.3)}.count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}.count strong{color:var(--e)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.card{padding:24px;text-decoration:none;color:inherit;transition:.2s}.card:hover{transform:translateY(-2px);border-color:rgba(52,211,153,.32)}.team-head,.player-head{display:flex;align-items:center;gap:15px}.logo-round,.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--e),var(--t));display:flex;align-items:center;justify-content:center;color:#04100b;font-weight:900;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:21px;font-weight:800}.game-nick{color:var(--tl);font-size:13px;margin-top:3px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-top:5px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.badge{padding:6px 9px;border-radius:8px;background:rgba(45,212,191,.08);color:var(--t);font-size:11px;font-weight:800}.team-bottom,.player-bottom{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.open{color:var(--e);font-weight:800}.empty{grid-column:1/-1;padding:54px 24px;text-align:center;color:var(--muted)}.panel{display:none}.panel.active{display:block}footer{flex-shrink:0;padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:760px){.hero h1{font-size:38px}.grid{grid-template-columns:1fr}.tabs{width:100%}.tab{flex:1}.team-bottom,.player-bottom{flex-direction:column}.nav-links{gap:12px}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="teams.html">Статистика</a></li><li class="profile-link"><a href="profile.html">Профиль</a></li><li class="login-link"><a class="btn-login" href="login.html">Вход</a></li><li class="logout-link"><a class="btn-login" href="#" onclick="logout();return false">Выйти</a></li></ul></nav></header><main class="container"><section class="hero"><div class="eyebrow">Статистика</div><h1>Команды и игроки.</h1><p>Поиск участников платформы и одобренных команд по всем турнирам.</p></section><div class="tabs"><button class="tab active" data-tab="teams">Команды</button><button class="tab" data-tab="players">Игроки</button></div><div class="controls"><label class="search"><input id="searchInput" type="search" autocomplete="off" placeholder="Найти команду по названию"></label></div><div class="filters"><button class="filter active" data-game="all">Все</button><button class="filter" data-game="dota2">Dota 2</button><button class="filter" data-game="cs2">CS2</button></div><section class="panel active" id="panel-teams"><div class="count" id="teamsCount">Загрузка...</div><div class="grid" id="teamsGrid"><div class="empty glass">Загрузка команд...</div></div></section><section class="panel" id="panel-players"><div class="count" id="playersCount"></div><div class="grid" id="playersGrid"></div></section></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>let currentTab='teams',currentGame='all',searchTerm='',timer=null;const gameMap={all:null,dota2:'dota 2',cs2:'cs2'},roleText={captain:'Капитан',main:'Основной игрок',reserve:'Запасной игрок'};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function initials(v){return String(v||'—').trim().slice(0,3).toUpperCase()}function teamHref(t){return t.tournament_id==='dota2-winter-2026'?`team.html?team=${encodeURIComponent(t.team_id)}`:`team-public.html?id=${encodeURIComponent(t.team_id)}&tournament=${encodeURIComponent(t.tournament_id)}`}async function loadTeams(){const grid=document.getElementById('teamsGrid'),count=document.getElementById('teamsCount');grid.innerHTML='<div class="empty glass">Загрузка команд...</div>';const {data,error}=await window.EsportsAPI.client.rpc('get_public_team_directory',{p_search:searchTerm||null,p_game:gameMap[currentGame]});if(error){grid.innerHTML=`<div class="empty glass">${esc(error.message)}</div>`;count.textContent='';return}const rows=data||[];count.innerHTML=`Найдено команд: <strong>${rows.length}</strong>`;grid.innerHTML=rows.length?rows.map(t=>`<a class="card glass" href="${teamHref(t)}"><div class="team-head"><div class="logo-round">${esc(initials(t.logo||t.team_name))}</div><div><div class="name">${esc(t.team_name)}</div><div class="sub">${esc(t.region||'Регион не указан')} · ${esc(t.tournament_name)}</div></div></div><div class="badges"><span class="badge">${esc(t.game)}</span></div><div class="team-bottom"><span>Одобренный участник турнира</span><span class="open">Открыть команду →</span></div></a>`).join(''):'<div class="empty glass">Команды не найдены.</div>'}async function loadPlayers(){const grid=document.getElementById('playersGrid'),count=document.getElementById('playersCount'),session=await window.EsportsAPI.getSession().catch(()=>null);if(!session){count.textContent='';grid.innerHTML='<div class="empty glass">Войдите, чтобы просматривать игроков.</div>';return}grid.innerHTML='<div class="empty glass">Загрузка игроков...</div>';const {data,error}=await window.EsportsAPI.client.rpc('get_public_player_directory',{p_search:searchTerm||null,p_game:gameMap[currentGame]});if(error){grid.innerHTML=`<div class="empty glass">${esc(error.message)}</div>`;count.textContent='';return}const rows=data||[];count.innerHTML=`Найдено игроков: <strong>${rows.length}</strong>`;grid.innerHTML=rows.length?rows.map(p=>{const avatar=p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc((p.nickname||'?')[0]),place=[p.city,p.country].filter(Boolean).join(', ')||'Локация не указана';const games=(p.games||[]).map(g=>`<span class="badge">${esc(g)}</span>`).join('');return `<a class="card glass" href="player-public.html?id=${encodeURIComponent(p.profile_id)}"><div class="player-head"><div class="avatar">${avatar}</div><div><div class="name">${esc(p.nickname)}</div>${p.game_nickname?`<div class="game-nick">${esc(p.game_nickname)}</div>`:''}<div class="sub">${esc(place)}</div></div></div><div class="badges">${p.primary_game?`<span class="badge">Основная: ${esc(p.primary_game)}</span>`:''}${p.game_role?`<span class="badge">${esc(p.game_role)}</span>`:''}${p.gaming_experience_years!=null?`<span class="badge">Опыт ${p.gaming_experience_years} лет</span>`:''}${games}</div><div class="player-bottom"><span>${p.current_team_name?`${esc(p.current_team_name)} · ${esc(roleText[p.team_role]||p.team_role||'')}`:'Сейчас без подтверждённой команды'}</span><span class="open">Открыть профиль →</span></div></a>`}).join(''):'<div class="empty glass">Игроки не найдены.</div>'}function refresh(){currentTab==='teams'?loadTeams():loadPlayers()}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;document.getElementById('panel-'+currentTab).classList.add('active');document.getElementById('searchInput').placeholder=currentTab==='teams'?'Найти команду по названию':'Найти игрока по нику или игровому нику';refresh()}));document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentGame=b.dataset.game;refresh()}));document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value.trim();clearTimeout(timer);timer=setTimeout(refresh,220)});document.addEventListener('DOMContentLoaded',loadTeams);</script></body></html>
