<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75)}nav{height:52px;max-width:1100px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav-links{display:flex;gap:20px;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:13px}.container{max-width:1100px;margin:auto;padding:60px 24px 100px}.eyebrow{color:var(--t);font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.hero h1{font-size:46px;margin-bottom:10px}.hero p{color:var(--muted);margin-bottom:34px}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.toolbar{padding:18px 20px;margin-bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.toolbar select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0b1813;color:var(--text)}.list{display:grid;gap:14px}.card{padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.team h2{font-size:20px;margin-bottom:5px}.meta{color:var(--muted);font-size:13px;line-height:1.55}.status{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:rgba(245,158,11,.13);color:#fbbf24}.approved{background:rgba(52,211,153,.13);color:var(--e)}.rejected{background:rgba(248,113,113,.13);color:#f87171}.roster{margin-top:18px;border-top:1px solid var(--border);padding-top:16px;display:grid;gap:8px}.player{padding:12px 14px;border-radius:12px;background:rgba(52,211,153,.04);display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:10px;font-size:13px}.player span{color:var(--muted)}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer}.approve{background:linear-gradient(135deg,var(--e),var(--t));color:#04100b}.reject{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.25)}.empty{padding:40px;text-align:center;color:var(--muted)}.error{padding:18px;color:#fca5a5}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:700px){.hero h1{font-size:34px}.top{flex-direction:column}.player{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="profile.html">Профиль</a></li></ul></nav></header><main class="container"><section class="hero"><div class="eyebrow">Администрирование</div><h1>Заявки команд</h1><p>Просмотр состава и изменение статуса заявки.</p></section><div class="toolbar glass"><strong>CS2 — будущий турнир</strong><select id="filter"><option value="all">Все заявки</option><option value="pending">На рассмотрении</option><option value="approved">Одобрены</option><option value="rejected">Отклонены</option></select></div><div id="list" class="list"><div class="glass empty">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>
const TID='cs2-future-draft';let applications=[];
const statusText={pending:'На рассмотрении',approved:'Одобрена',rejected:'Отклонена'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const f=document.getElementById('filter').value;const rows=applications.filter(a=>f==='all'||a.application_status===f);const list=document.getElementById('list');if(!rows.length){list.innerHTML='<div class="glass empty">Заявок с таким статусом нет.</div>';return}list.innerHTML=rows.map(a=>`<article class="card glass"><div class="top"><div class="team"><h2>${esc(a.team_name)} [${esc(a.team_tag)}]</h2><div class="meta">${esc(a.submitter_nickname||'Пользователь')} · ${esc(a.submitter_email||'')}<br>Подана: ${new Date(a.submitted_at).toLocaleString('ru-RU')}</div></div><span class="status ${esc(a.application_status)}">${statusText[a.application_status]||esc(a.application_status)}</span></div><div class="roster">${(a.roster_private||[]).map((p,i)=>`<div class="player"><strong>${i+1}. ${esc(p.full_name)} ${p.captain?'· капитан':p.reserve?'· запасной':''}</strong><span>${esc(p.city)} · ${esc(p.phone)}</span><span>${esc(p.email)}<br>${esc(p.steam_url)}</span></div>`).join('')}</div>${a.application_status==='pending'?`<div class="actions"><button class="btn approve" onclick="review('${a.application_id}','approved')">Одобрить</button><button class="btn reject" onclick="review('${a.application_id}','rejected')">Отклонить</button></div>`:''}</article>`).join('')}
async function load(){const session=await window.EsportsAPI.getSession().catch(()=>null);if(!session){location.replace('login.html?return=admin.html');return}const {data:isAdmin,error:ae}=await window.EsportsAPI.client.rpc('is_tournament_admin');if(ae||!isAdmin){document.getElementById('list').innerHTML='<div class="glass error">Нет доступа к админ-панели.</div>';return}const {data,error}=await window.EsportsAPI.client.rpc('admin_list_applications',{p_tournament_id:TID});if(error){document.getElementById('list').innerHTML='<div class="glass error">'+esc(error.message)+'</div>';return}applications=data||[];render()}
async function review(id,status){if(!confirm(status==='approved'?'Одобрить эту заявку?':'Отклонить эту заявку?'))return;const {error}=await window.EsportsAPI.client.rpc('admin_review_application',{p_application_id:id,p_status:status});if(error){alert(error.message);return}await load()}
document.getElementById('filter').addEventListener('change',render);document.addEventListener('DOMContentLoaded',load);
</script></body></html>
