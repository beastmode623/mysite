<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Уведомления — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75)}nav{height:52px;max-width:980px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{color:var(--e);font-size:21px;font-weight:800;text-decoration:none}.nav{display:flex;gap:18px}.nav a{color:var(--muted);text-decoration:none;font-size:13px}.container{max-width:860px;margin:auto;padding:60px 24px 100px}.back{color:var(--t);text-decoration:none}.hero{padding:34px 0}.hero h1{font-size:44px;margin-bottom:8px}.hero p{color:var(--muted)}.list{display:grid;gap:12px}.item{padding:20px 22px;border-radius:18px;border:1px solid var(--border);background:var(--glass)}.item.unread{border-color:rgba(52,211,153,.34);background:rgba(52,211,153,.06)}.top{display:flex;justify-content:space-between;gap:16px}.title{font-size:17px;font-weight:800}.time{font-size:12px;color:var(--muted);white-space:nowrap}.body{color:var(--muted);font-size:14px;line-height:1.55;margin-top:7px}.actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--e),var(--t));border:0;color:#04100b}.empty{padding:44px;text-align:center;color:var(--muted);border:1px solid var(--border);border-radius:18px;background:var(--glass)}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="profile.html">Профиль</a><a href="teams.html">Статистика</a></div></nav></header><main class="container"><a class="back" href="profile.html">← В профиль</a><section class="hero"><h1>Уведомления</h1><p>Приглашения, решения по заявкам, изменения состава и капитанства.</p></section><div id="list" class="list"><div class="empty">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function mark(id,href){await window.EsportsAPI.client.rpc('mark_notification_read',{p_notification_id:id});if(href)location.href=href;else load()}async function load(){const session=await window.EsportsAPI.getSession().catch(()=>null);if(!session){location.replace('login.html?return=notifications.html');return}const root=document.getElementById('list');const {data,error}=await window.EsportsAPI.client.rpc('get_my_notifications');if(error){root.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}if(!data?.length){root.innerHTML='<div class="empty">Уведомлений пока нет.</div>';return}root.innerHTML=data.map(n=>`<article class="item ${n.read_at?'':'unread'}"><div class="top"><div class="title">${esc(n.title)}</div><div class="time">${new Date(n.created_at).toLocaleString('ru-RU')}</div></div>${n.body?`<div class="body">${esc(n.body)}</div>`:''}<div class="actions">${n.href?`<button class="btn primary" onclick="mark('${n.notification_id}','${esc(n.href)}')">Открыть</button>`:''}${n.read_at?'':`<button class="btn" onclick="mark('${n.notification_id}',null)">Прочитано</button>`}</div></article>`).join('')}document.addEventListener('DOMContentLoaded',load);</script></body></html>
