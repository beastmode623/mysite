<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моя команда — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}header{border-bottom:1px solid var(--border);background:rgba(5,10,8,.75);position:sticky;top:0;z-index:20}nav{height:52px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;color:var(--e);text-decoration:none}.nav{display:flex;gap:20px}.nav a{font-size:13px;color:var(--muted);text-decoration:none}.container{max-width:980px;margin:auto;padding:64px 24px 100px}.back{color:var(--t);text-decoration:none}.hero{padding:38px 0 28px}.hero h1{font-size:44px;margin-bottom:9px}.hero p{color:var(--muted);line-height:1.6}.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px}.card,.section{padding:26px;margin-bottom:18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.name{font-size:27px;font-weight:800}.meta,.intro{color:var(--muted);font-size:13px;line-height:1.6;margin-top:6px}.status{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800}.approved{background:rgba(52,211,153,.12);color:var(--e)}.pending{background:rgba(245,158,11,.12);color:#fbbf24}.rejected{background:rgba(248,113,113,.12);color:#f87171}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--e),var(--t));border:0;color:#04100b}.roster{display:grid;gap:10px;margin-top:18px}.player{padding:14px 16px;border-radius:14px;border:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;align-items:center}.pname{color:var(--text);text-decoration:none;font-weight:800}.pname:hover{color:var(--t)}.role{color:var(--t);font-size:12px;margin-top:5px}.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}.state{font-size:11px;font-weight:800;color:var(--muted)}.invite{display:flex;gap:7px}.invite input,.swap select{padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:#07130f;color:var(--text)}.notice{padding:14px;border-radius:12px;border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.05);color:#d6b66d;line-height:1.5;font-size:13px;margin-top:16px}.swap{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:16px}.history{display:grid;gap:9px;margin-top:14px}.history div{padding:12px;border-radius:11px;background:rgba(52,211,153,.035);border:1px solid var(--border);font-size:13px;color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}footer{padding:36px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:760px){.head,.player{flex-direction:column;align-items:flex-start}.side{align-items:flex-start;width:100%}.invite,.swap{grid-template-columns:1fr;flex-direction:column;width:100%}.invite input{width:100%}}</style></head><body><header><nav><a class="logo" href="index.html">Esports</a><div class="nav"><a href="notifications.html">Уведомления</a><a href="profile.html">Профиль</a></div></nav></header><main class="container"><a class="back" href="profile.html">← В профиль</a><section class="hero"><h1>Моя команда</h1><p>Приглашения и капитанство работают напрямую до начала турнира. Обмен основного и запасного игрока проходит через подтверждение администратора.</p></section><div id="content"><div class="glass empty">Загрузка...</div></div></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const roles={captain:'Капитан',main:'Основной состав',reserve:'Запасной'},statuses={approved:'Одобрена',pending:'На рассмотрении',rejected:'Отклонена'};async function invite(id,input,btn){const email=input.value.trim().toLowerCase();if(!email)return alert('Укажите email игрока.');btn.disabled=true;const {error}=await window.EsportsAPI.client.rpc('captain_invite_team_member',{p_member_id:id,p_email:email});if(error){alert(error.message);btn.disabled=false;return}alert('Приглашение создано внутри сайта.');location.reload()}async function transfer(team,id,name,btn){if(!confirm(`Передать капитанство игроку «${name}»?`))return;btn.disabled=true;const {error}=await window.EsportsAPI.client.rpc('transfer_team_captaincy',{p_team_id:team,p_target_member_id:id});if(error){alert(error.message);btn.disabled=false;return}location.replace('profile.html')}async function requestSwap(team,mainSel,resSel,btn){if(!mainSel.value||!resSel.value)return alert('Выберите основного и запасного игрока.');if(!confirm('Отправить обмен ролей на проверку администратору?'))return;btn.disabled=true;const {error}=await window.EsportsAPI.client.rpc('captain_request_role_swap',{p_team_id:team,p_main_member_id:mainSel.value,p_reserve_member_id:resSel.value});if(error){alert(error.message);btn.disabled=false;return}alert('Запрос отправлен администратору.');location.reload()}document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('content');const s=await window.EsportsAPI.getSession().catch(()=>null);if(!s){location.replace('login.html?return=my-team.html');return}const {data:teams,error}=await window.EsportsAPI.client.from('teams').select('id,tournament_id,name,tag,registration_status,created_at').eq('owner_id',s.user.id).order('created_at',{ascending:false});if(error){root.innerHTML='<div class="glass empty">'+esc(error.message)+'</div>';return}if(!teams?.length){root.innerHTML='<div class="glass empty">У вас нет команды под управлением.</div>';return}const tids=[...new Set(teams.map(x=>x.tournament_id))];const {data:ts}=await window.EsportsAPI.client.from('tournaments').select('id,name,game,status').in('id',tids);const tmap=new Map((ts||[]).map(x=>[x.id,x]));let html='';for(const team of teams){const t=tmap.get(team.tournament_id)||{};const {data:m,error:me}=await window.EsportsAPI.client.rpc('get_team_member_management',{p_team_id:team.id});const {data:reqs}=await window.EsportsAPI.client.rpc('get_my_roster_change_requests',{p_team_id:team.id});const locked=['ongoing','live','finished','cancelled'].includes(t.status);html+=`<section class="card glass"><div class="head"><div><div class="name">${esc(team.name)} [${esc(team.tag)}]</div><div class="meta">${esc(t.name||team.tournament_id)} · ${esc(t.game||'')} · стадия: ${esc(t.status||'')}</div></div><span class="status ${esc(team.registration_status)}">${esc(statuses[team.registration_status]||team.registration_status)}</span></div><div class="actions"><a class="btn primary" href="team-public.html?id=${encodeURIComponent(team.id)}&tournament=${encodeURIComponent(team.tournament_id)}">Публичная страница</a><a class="btn" href="team-settings.html">Профиль команды</a></div>${locked?'<div class="notice">Турнир уже начался или завершён: обычные изменения состава заблокированы. В экстренной ситуации нужен администратор.</div>':''}</section><section class="section glass"><h2>Состав и приглашения</h2><p class="intro">Свободное место сохраняет свою роль. Приглашения, выход игроков и передача капитанства доступны только до блокировки состава.</p><div class="roster">${me?`<div class="empty">${esc(me.message)}</div>`:(m||[]).map(x=>{const name=x.profile_id?`<a class="pname" href="player-public.html?id=${encodeURIComponent(x.profile_id)}">${x.roster_position}. ${esc(x.display_name)}</a>`:`<span class="pname">${x.roster_position}. ${esc(x.display_name)}</span>`;const inv=!locked&&!x.linked&&x.role!=='captain'?`<div class="invite"><input type="email" value="${esc(x.invitation_email||'')}" placeholder="email" data-email="${x.member_id}"><button class="btn primary" data-invite="${x.member_id}">Пригласить</button></div>`:'';const tr=!locked&&x.linked&&x.role==='main'?`<button class="btn" data-transfer="${x.member_id}" data-team="${esc(team.id)}" data-name="${esc(x.display_name)}">Передать капитанство</button>`:'';return `<div class="player"><div>${name}<div class="role">${esc(roles[x.role]||x.role)}</div></div><div class="side"><span class="state">${x.linked?'Аккаунт подтверждён':'Место не подтверждено'}</span>${inv}${tr}</div></div>`}).join('')}</div></section>`;const mains=(m||[]).filter(x=>x.role==='main'),res=(m||[]).filter(x=>x.role==='reserve');html+=`<section class="section glass"><h2>Изменение ролей</h2><p class="intro">Чтобы не нарушить размер основного состава, капитан отправляет на проверку именно обмен: один основной игрок ↔ один запасной.</p>${!locked&&mains.length&&res.length?`<div class="swap"><select data-main="${team.id}"><option value="">Основной игрок</option>${mains.map(x=>`<option value="${x.member_id}">${esc(x.display_name)}</option>`).join('')}</select><select data-res="${team.id}"><option value="">Запасной игрок</option>${res.map(x=>`<option value="${x.member_id}">${esc(x.display_name)}</option>`).join('')}</select><button class="btn primary" data-swap="${team.id}">Отправить</button></div>`:'<div class="notice">Обмен сейчас недоступен: нет подходящей пары или состав заблокирован.</div>'}<div class="history">${(reqs||[]).map(r=>`<div><strong>${esc(r.main_name)} ↔ ${esc(r.reserve_name)}</strong><br>${new Date(r.requested_at).toLocaleString('ru-RU')} · ${esc(statuses[r.status]||r.status)}${r.review_note?` · ${esc(r.review_note)}`:''}</div>`).join('')||'<div>Запросов на изменение ролей пока нет.</div>'}</div></section>`}root.innerHTML=html;root.querySelectorAll('[data-invite]').forEach(b=>b.onclick=()=>invite(b.dataset.invite,root.querySelector(`[data-email="${b.dataset.invite}"]`),b));root.querySelectorAll('[data-transfer]').forEach(b=>b.onclick=()=>transfer(b.dataset.team,b.dataset.transfer,b.dataset.name,b));root.querySelectorAll('[data-swap]').forEach(b=>b.onclick=()=>requestSwap(b.dataset.swap,root.querySelector(`[data-main="${b.dataset.swap}"]`),root.querySelector(`[data-res="${b.dataset.swap}"]`),b))});</script></body></html>
