<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Турниры — Esports Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--emerald:#34d399;--tiffany:#2dd4bf;--tiffany-light:#5eead4;--bg-dark:#050a08;--bg-mid:#0a1a14;--bg-tiffany:#081818;--text-primary:#f0fdf4;--text-secondary:#6b9b87;--glass-bg:rgba(12,40,30,.35);--glass-border:rgba(52,211,153,.12);--glass-border-hover:rgba(52,211,153,.3);--accent-gradient:linear-gradient(135deg,var(--emerald),var(--tiffany))}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg-dark),var(--bg-mid) 50%,var(--bg-tiffany));color:var(--text-primary);min-height:100vh}header{background:rgba(5,10,8,.6);backdrop-filter:blur(30px);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:10}nav{max-width:1080px;margin:auto;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:600;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-links{display:flex;gap:24px;list-style:none;align-items:center}.nav-links a{color:var(--text-secondary);text-decoration:none;font-size:13px}.profile-link,.logout-link{display:none}.btn-login{padding:7px 20px!important;border:1px solid var(--glass-border);border-radius:999px;color:var(--text-primary)!important}.container{max-width:1080px;margin:auto;padding:80px 24px 100px}.page-header{text-align:center;margin-bottom:48px}.page-header h1{font-size:56px;margin:8px 0 12px}.page-header p{color:var(--text-secondary);font-size:18px}.page-eyebrow{color:var(--tiffany);text-transform:uppercase;letter-spacing:.1em;font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}.filter-btn{padding:10px 20px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-secondary);cursor:pointer}.filter-btn.active{background:var(--accent-gradient);color:#050a08;font-weight:700}.tournaments-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:24px;backdrop-filter:blur(24px)}.tournament-card{padding:28px;display:flex;flex-direction:column;min-height:390px}.tournament-status{align-self:flex-start;padding:5px 12px;border-radius:999px;font-size:11px;text-transform:uppercase;font-weight:700;margin-bottom:14px}.status-draft{background:rgba(245,158,11,.13);color:#fbbf24}.status-registration{background:rgba(52,211,153,.15);color:var(--emerald)}.status-upcoming{background:rgba(45,212,191,.13);color:var(--tiffany)}.status-live,.status-ongoing{background:rgba(45,212,191,.2);color:var(--tiffany-light)}.status-finished{background:rgba(107,155,135,.15);color:var(--text-secondary)}.game-tag{font-size:11px;color:var(--tiffany);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px}.tournament-card h3{font-size:24px;line-height:1.2;margin-bottom:10px}.tournament-card>p{color:var(--text-secondary);font-size:14px;line-height:1.5}.meta{margin-top:auto;padding:18px 0;border-top:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);display:grid;gap:10px}.meta-row{display:flex;justify-content:space-between;gap:16px;font-size:13px}.meta-row span:first-child{color:var(--text-secondary)}.btn-link{margin-top:20px;color:var(--tiffany);text-decoration:none;font-weight:600}.no-results{display:none;text-align:center;color:var(--text-secondary);padding:50px}footer{padding:40px;text-align:center;color:var(--text-secondary);font-size:12px;border-top:1px solid var(--glass-border)}@media(max-width:834px){.tournaments-grid{grid-template-columns:1fr}.page-header h1{font-size:40px}}
</style>
</head>
<body>
<header><nav><a href="index.html" class="logo">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="teams.html">Статистика</a></li><li class="profile-link"><a href="profile.html">Профиль</a></li><li class="login-link"><a href="login.html" class="btn-login">Вход</a></li><li class="logout-link"><a href="#" class="btn-login" onclick="logout();return false;">Выйти</a></li></ul></nav></header>
<div class="container"><div class="page-header"><p class="page-eyebrow">Турниры</p><h1>Найди свой турнир.</h1><p>Актуальные и завершённые соревнования платформы.</p></div>
<div class="filters"><button class="filter-btn active" data-filter="all">Все</button><button class="filter-btn" data-filter="dota2">Dota 2</button><button class="filter-btn" data-filter="cs2">CS2</button><button class="filter-btn" data-filter="draft">Черновики</button><button class="filter-btn" data-filter="registration">Регистрация</button><button class="filter-btn" data-filter="finished">Завершённые</button></div>
<div class="tournaments-grid" id="tournamentsGrid"><div class="glass" style="padding:60px;text-align:center;color:var(--text-secondary);grid-column:1/-1">Загрузка турниров...</div></div><div class="no-results" id="noResults">Ничего не найдено</div></div>
<footer>© 2026 Esports Platform. Все права защищены.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script>
<script>
function fmt(v){if(!v)return 'Не задано';return new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function card(t){const labels={draft:'Черновик',registration:'Регистрация',upcoming:'Скоро',live:'LIVE',ongoing:'В процессе',finished:'Завершён',cancelled:'Отменён'};const g=t.game.toLowerCase().replace(/\s+/g,'');const dates=t.startDate?(t.endDate?`${fmt(t.startDate)} — ${fmt(t.endDate)}`:fmt(t.startDate)):'Не заданы';const link=t.status==='draft'?`tournament-draft.html?id=${encodeURIComponent(t.id)}`:`tournament.html?id=${encodeURIComponent(t.id)}`;return `<div class="tournament-card glass" data-game="${g}" data-status="${t.status}"><span class="tournament-status status-${t.status}">${labels[t.status]||t.status}</span><span class="game-tag">${t.game}</span><h3>${t.name}</h3><p>${t.description||'Описание будет добавлено позже.'}</p><div class="meta"><div class="meta-row"><span>Даты</span><strong>${dates}</strong></div><div class="meta-row"><span>Команд</span><strong>${t.maxTeams??'Не задано'}</strong></div><div class="meta-row"><span>Формат</span><strong>${t.format||'Не задан'}</strong></div></div><a class="btn-link" href="${link}">${t.status==='draft'?'Открыть черновик':t.status==='finished'?'Подробнее':'Открыть турнир'} ›</a></div>`}
function filters(){document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');let n=0;document.querySelectorAll('.tournament-card').forEach(c=>{const f=b.dataset.filter;const show=f==='all'||c.dataset.game===f||c.dataset.status===f;c.style.display=show?'flex':'none';if(show)n++});document.getElementById('noResults').style.display=n?'none':'block'}))}
document.addEventListener('DOMContentLoaded',async()=>{const grid=document.getElementById('tournamentsGrid');try{const items=await window.EsportsAPI.listTournaments();grid.innerHTML=items.map(card).join('');filters()}catch(e){grid.innerHTML=`<div class="glass" style="padding:60px;text-align:center;grid-column:1/-1">Не удалось загрузить турниры: ${e.message}</div>`}});
</script>
</body></html>
