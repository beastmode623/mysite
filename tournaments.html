<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турниры — Esports Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --emerald: #34d399; --tiffany: #2dd4bf; --tiffany-light: #5eead4;
            --bg-dark: #050a08; --bg-mid: #0a1a14; --bg-tiffany: #081818;
            --text-primary: #f0fdf4; --text-secondary: #6b9b87;
            --glass-bg: rgba(12, 40, 30, 0.35); --glass-bg-hover: rgba(16, 55, 40, 0.45);
            --glass-border: rgba(52, 211, 153, 0.12); --glass-border-hover: rgba(52, 211, 153, 0.3);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
            --accent-gradient: linear-gradient(135deg, var(--emerald) 0%, var(--tiffany) 100%);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: linear-gradient(170deg, var(--bg-dark), var(--bg-mid) 50%, var(--bg-tiffany)); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
        header { background: rgba(5,10,8,0.6); backdrop-filter: saturate(200%) blur(30px); -webkit-backdrop-filter: saturate(200%) blur(30px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--glass-border); }
        nav { max-width: 1080px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 21px; font-weight: 600; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
        .nav-links { display: flex; gap: 24px; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; transition: color 0.3s; }
        .nav-links a:hover { color: var(--emerald); }
        .profile-link, .logout-link { display: none; }
        .nav-links .btn-login { padding: 7px 20px; background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 980px; color: var(--text-primary) !important; font-weight: 500; transition: all 0.35s cubic-bezier(0.28,0.11,0.32,1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); cursor: pointer; }
        .nav-links .btn-login:hover { background: var(--tiffany); color: #050a08 !important; border-color: var(--tiffany); box-shadow: 0 0 24px rgba(45,212,191,0.35), inset 0 1px 0 rgba(255,255,255,0.2); transform: translateY(-1px); }

        .container { max-width: 1080px; margin: 0 auto; padding: 80px 24px 100px; }

        .page-header { text-align: center; margin-bottom: 60px; }
        .page-eyebrow { font-size: 15px; color: var(--tiffany); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; margin-bottom: 10px; }
        .page-header h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; background: linear-gradient(180deg, #fff 20%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
        .page-header p { font-size: 19px; color: var(--text-secondary); }

        .filters { display: flex; gap: 8px; margin-bottom: 48px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 10px 22px; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 980px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-family: inherit; transition: all 0.3s; }
        .filter-btn:hover { border-color: var(--glass-border-hover); color: var(--text-primary); }
        .filter-btn.active { background: var(--accent-gradient); color: #050a08; border-color: transparent; font-weight: 600; }

        .tournaments-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .tournament-card {
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            min-height: 420px;
        }

        .tournament-status { display: inline-block; padding: 4px 14px; border-radius: 980px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; align-self: flex-start; }
        .status-upcoming { background: rgba(52, 211, 153, 0.15); color: var(--emerald); }
        .status-live { background: rgba(52, 211, 153, 0.2); color: var(--tiffany-light); animation: pulse 2s infinite; }
        .status-finished { background: rgba(107, 155, 135, 0.15); color: var(--text-secondary); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .game-tag { display: inline-block; font-size: 11px; color: var(--tiffany); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 10px; margin-left: 8px; }
        .tournament-card h3 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px; line-height: 1.2; }
        .tournament-card > p { color: var(--text-secondary); font-size: 14px; line-height: 1.5; }

        /* ── Выровненная мета-информация ── */
        .tournament-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: auto;
            padding: 20px 0;
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }
        .tournament-meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }
        .tournament-meta-item .meta-icon {
            flex-shrink: 0;
            width: 20px;
            text-align: center;
            color: var(--tiffany);
        }
        .tournament-meta-item .meta-label {
            color: var(--text-secondary);
            min-width: 90px;
            flex-shrink: 0;
        }
        .tournament-meta-item .meta-value {
            color: var(--text-primary);
            font-weight: 500;
            margin-left: auto;
            text-align: right;
        }

        .btn-link { display: inline-flex; align-items: center; gap: 6px; color: var(--tiffany); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.3s; margin-top: 24px; align-self: flex-start; }
        .btn-link:hover { color: var(--tiffany-light); }
        .btn-link::after { content: '›'; font-size: 20px; line-height: 1; }

        .glass { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--glass-shadow); transition: transform 0.4s cubic-bezier(0.28,0.11,0.32,1), border-color 0.3s, background 0.3s; }
        .glass:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); transform: translateY(-4px); }

        .no-results { text-align: center; padding: 80px 24px; color: var(--text-secondary); font-size: 17px; display: none; }
        .no-results-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        .loading-state { text-align: center; padding: 60px 24px; color: var(--text-secondary); font-size: 15px; grid-column: 1 / -1; }

        footer { background: var(--bg-dark); padding: 40px 24px; text-align: center; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--glass-border); }

        @media (max-width: 834px) {
            .page-header h1 { font-size: 40px; }
            .tournaments-grid { grid-template-columns: 1fr; }
            .tournament-card { min-height: auto; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Esports</a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="tournaments.html">Турниры</a></li>
                <li><a href="teams.html">Статистика</a></li>
                <li class="profile-link"><a href="profile.html">Профиль</a></li>
                <li class="login-link"><a href="login.html" class="btn-login">Вход</a></li>
                <li class="logout-link"><a href="#" class="btn-login" onclick="logout(); return false;">Выйти</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <p class="page-eyebrow">Турниры</p>
            <h1>Найди свой турнир.</h1>
            <p>Регистрируй команду и соревнуйся.</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="dota2">Dota 2</button>
            <button class="filter-btn" data-filter="cs2">CS2</button>
            <button class="filter-btn" data-filter="valorant">Valorant</button>
            <button class="filter-btn" data-filter="upcoming">Предстоящие</button>
            <button class="filter-btn" data-filter="live">В процессе</button>
            <button class="filter-btn" data-filter="finished">Завершённые</button>
        </div>

        <div class="tournaments-grid" id="tournamentsGrid">
            <div class="loading-state glass" style="padding: 60px;">Загрузка турниров...</div>
        </div>

        <div class="no-results" id="noResults">
            <div class="no-results-icon">🔍</div>
            <div>Ничего не найдено</div>
        </div>
    </div>

    <footer><p>© 2026 Esports Platform. Все права защищены.</p></footer>

    <script>
        const TOURNAMENT_FILE = 'data/tournament-dota2-2026.json';

        function formatDateRu(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function renderTournamentCard(tournament) {
            const statusMap = {
                'upcoming': { text: 'Скоро', class: 'status-upcoming' },
                'live': { text: 'LIVE', class: 'status-live' },
                'finished': { text: 'Завершён', class: 'status-finished' }
            };
            const status = statusMap[tournament.status] || statusMap['upcoming'];

            const dateText = tournament.endDate
                ? `${formatDateRu(tournament.startDate)} — ${formatDateRu(tournament.endDate)}`
                : formatDateRu(tournament.startDate);

            const isFinished = tournament.status === 'finished';
            const buttonText = isFinished ? 'Подробнее' : 'Регистрация';
            const buttonLink = `tournament.html?id=${tournament.id}`;

            const gameKey = tournament.game.toLowerCase().replace(/\s+/g, '');

            return `
                <div class="tournament-card glass" data-game="${gameKey}" data-status="${tournament.status}">
                    <span class="tournament-status ${status.class}">${status.text}</span>
                    <span class="game-tag">${tournament.game}</span>
                    <h3>${tournament.name}</h3>
                    <p>${tournament.description}</p>
                    <div class="tournament-meta">
                        <div class="tournament-meta-item">
                            <span class="meta-icon">📅</span>
                            <span class="meta-label">Даты</span>
                            <span class="meta-value">${dateText}</span>
                        </div>
                        <div class="tournament-meta-item">
                            <span class="meta-icon">👥</span>
                            <span class="meta-label">Команд</span>
                            <span class="meta-value">${tournament.maxTeams}</span>
                        </div>
                        <div class="tournament-meta-item">
                            <span class="meta-icon">🎮</span>
                            <span class="meta-label">Формат</span>
                            <span class="meta-value">${tournament.format}</span>
                        </div>
                    </div>
                    <a href="${buttonLink}" class="btn-link">${buttonText}</a>
                </div>
            `;
        }

        async function loadTournaments() {
            const grid = document.getElementById('tournamentsGrid');

            try {
                const response = await fetch(TOURNAMENT_FILE);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                grid.innerHTML = renderTournamentCard(data.tournament);
                initFilters();

            } catch (error) {
                console.error('Ошибка загрузки турниров:', error);
                grid.innerHTML = `
                    <div class="loading-state glass" style="padding: 60px;">
                        <div style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;">⚠️</div>
                        <div>Не удалось загрузить турниры</div>
                        <div style="color: var(--text-secondary); font-size: 13px; margin-top: 8px;">${error.message}</div>
                    </div>
                `;
            }
        }

        function initFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            const noResults = document.getElementById('noResults');

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    const filter = button.dataset.filter;
                    const tournamentCards = document.querySelectorAll('.tournament-card');
                    let visibleCount = 0;

                    tournamentCards.forEach(card => {
                        const game = card.dataset.game;
                        const status = card.dataset.status;

                        if (filter === 'all' || game === filter || status === filter) {
                            card.style.display = 'flex';
                            visibleCount++;
                        } else {
                            card.style.display = 'none';
                        }
                    });

                    noResults.style.display = visibleCount === 0 ? 'block' : 'none';
                });
            });
        }

        function applyUrlFilter() {
            const urlParams = new URLSearchParams(window.location.search);
            const filter = urlParams.get('filter');
            if (filter) {
                const targetButton = document.querySelector(`[data-filter="${filter}"]`);
                if (targetButton) {
                    setTimeout(() => targetButton.click(), 500);
                }
            }
        }
document.addEventListener('DOMContentLoaded', function() {
            loadTournaments().then(() => applyUrlFilter());
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
