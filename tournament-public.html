<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Турнир — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--bg:#050a08;--bg2:#0a1a14;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}.container{max-width:980px;margin:auto;padding:64px 24px 100px}.back{color:var(--t);text-decoration:none}.hero{text-align:center;padding:46px 0 34px}.hero h1{font-size:50px}.muted,.hero p{color:var(--muted)}.glass{background:var(--glass);border:1px solid var(--border);border-radius:24px}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.item{padding:20px}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.value{font-size:17px;font-weight:700;margin-top:8px}.box{padding:26px;margin-bottom:22px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 20px;border-radius:13px;text-decoration:none;font-weight:800}.primary{background:linear-gradient(135deg,var(--e),var(--t));color:#04100b}.secondary{border:1px solid var(--border);color:var(--text)}.teams{display:grid;gap:12px;margin-top:18px}.team{padding:18px;border:1px solid var(--border);border-radius:16px}.team a{color:var(--text);font-weight:800;text-decoration:none}.roster{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.player{padding:6px 10px;border-radius:999px;background:rgba(45,212,191,.08);color:var(--muted);text-decoration:none;font-size:12px}@media(max-width:700px){.info{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}</style></head><body><main class="container"><a class="back" href="tournaments.html">← Все турниры</a><section class="hero"><div id="game" class="muted"></div><h1 id="name">Загрузка...</h1><p id="description"></p></section><div class="info"><div class="item glass"><div class="label">Даты</div><div id="dates" class="value">—</div></div><div class="item glass"><div class="label">Формат</div><div id="format" class="value">—</div></div><div class="item glass"><div class="label">Команды</div><div id="count" class="value">—</div></div><div class="item glass"><div class="label">Состав</div><div id="size" class="value">—</div></div></div><section class="box glass"><h2>Регистрация команд</h2><p id="reg" class="muted"></p><div id="actions" class="actions"></div></section><section class="box glass"><h2>Участники турнира</h2><p class="muted">Только одобренные команды и актуальные составы.</p><div id="teams" class="teams"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),D=v=>v?new Date(v).toLocaleDateString('ru-RU'):'Не задано';document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return location.replace('tournaments.html');if(id==='dota2-winter-2026')return location.replace(`tournament.html?id=${encodeURIComponent(id)}`);try{const t=await window.EsportsAPI.getTournament(id);if(!t)throw Error('Турнир не найден');if(t.status==='draft')return location.replace(`tournament-draft.html?id=${encodeURIComponent(id)}`);const {data,error}=await window.EsportsAPI.client.rpc('get_public_tournament_teams',{p_tournament_id:id});if(error)throw error;const teams=data||[];document.title=t.name;name.textContent=t.name;game.textContent=t.game||'';description.textContent=t.description||'Описание будет добавлено позже.';dates.textContent=t.startDate?(t.endDate?`${D(t.startDate)} — ${D(t.endDate)}`:D(t.startDate)):'Не заданы';format.textContent=t.format||'Не задан';count.textContent=t.maxTeams!=null?`${teams.length} / ${t.maxTeams}`:teams.length;size.textContent=t.teamSize?`${t.teamSize} основных${t.maxReserves!=null?` + до ${t.maxReserves} запасных`:''}`:'Не задан';document.getElementById('teams').innerHTML=teams.length?teams.map(x=>{const roster=Array.isArray(x.roster)?x.roster:[];return `<article class="team"><a href="team-public.html?id=${encodeURIComponent(x.team_id)}&tournament=${encodeURIComponent(id)}">${E(x.team_name)}</a><div class="muted">${E(x.region||'')}</div><div class="roster">${roster.map(p=>p.profile_id?`<a class="player" href="player-public.html?id=${encodeURIComponent(p.profile_id)}">${p.roster_position}. ${E(p.display_name)}</a>`:`<span class="player">${p.roster_position}. ${E(p.display_name)}</span>`).join('')}</div></article>`}).join(''):'<div class="muted">Одобренных команд пока нет.</div>';const {data:r}=await window.EsportsAPI.client.rpc('can_register_for_tournament',{p_tournament_id:id}),row=Array.isArray(r)?r[0]:r;reg.textContent=row?.reason||((row?.allowed)?'Регистрация открыта.':'Регистрация закрыта.');actions.innerHTML=(row?.allowed&&row?.mode==='public'?`<a class="btn primary" href="register-team.html?tournament=${encodeURIComponent(id)}">Подать заявку</a>`:'')+`<a class="btn secondary" href="tournament-rules.html?id=${encodeURIComponent(id)}">Правила турнира</a>`}catch(e){name.textContent='Не удалось загрузить турнир';description.textContent=e.message}});</script></body></html>
