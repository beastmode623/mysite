<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Турнир — Esports Platform</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--e:#34d399;--t:#2dd4bf;--tl:#5eead4;--bg:#050a08;--bg2:#0a1a14;--bg3:#081818;--text:#f0fdf4;--muted:#6b9b87;--glass:rgba(12,40,30,.35);--border:rgba(52,211,153,.12);--grad:linear-gradient(135deg,var(--e),var(--t))}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2) 50%,var(--bg3));color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{background:rgba(5,10,8,.6);backdrop-filter:blur(30px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}nav{max-width:1080px;margin:auto;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-links{display:flex;gap:24px;list-style:none;align-items:center}.nav-links a{color:var(--muted);text-decoration:none;font-size:13px}.profile-link,.logout-link{display:none}.btn-login{padding:7px 20px!important;border:1px solid var(--border);border-radius:999px;color:var(--text)!important}.container{width:100%;max-width:1080px;margin:auto;padding:64px 24px 100px;flex:1}.back{color:var(--t);text-decoration:none}.hero{text-align:center;padding:46px 0 34px}.eyebrow{color:var(--t);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:50px;line-height:1.08;margin:10px 0 14px}.hero p{max-width:720px;margin:auto;line-height:1.65}.muted,.hero p{color:var(--muted)}.status{display:inline-flex;margin-top:18px;padding:7px 13px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid var(--border)}.status-registration{color:var(--e);background:rgba(52,211,153,.1)}.status-upcoming{color:var(--t);background:rgba(45,212,191,.1)}.status-live,.status-ongoing{color:var(--tl);background:rgba(45,212,191,.16)}.status-finished{color:#9cc9b6;background:rgba(107,155,135,.1)}.status-cancelled{color:#fca5a5;background:rgba(248,113,113,.08)}.glass{background:var(--glass);border:1px solid var(--border);border-radius:24px;backdrop-filter:blur(24px)}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.item{padding:20px}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.value{font-size:17px;font-weight:700;margin-top:8px}.box{padding:26px;margin-bottom:22px}.box h2{margin-bottom:8px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 20px;border-radius:13px;text-decoration:none;font-weight:800}.primary{background:var(--grad);color:#04100b}.secondary{border:1px solid var(--border);color:var(--text)}.teams{display:grid;gap:12px;margin-top:18px}.team{padding:18px;border:1px solid var(--border);border-radius:16px;background:rgba(52,211,153,.025)}.team>a{color:var(--text);font-size:17px;font-weight:800;text-decoration:none}.roster{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.player{padding:6px 10px;border-radius:999px;background:rgba(45,212,191,.08);color:#9cc9b6;text-decoration:none;font-size:12px}footer{padding:40px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:760px){.info{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}.nav-links{gap:12px;flex-wrap:wrap;justify-content:flex-end}}@media(max-width:470px){.info{grid-template-columns:1fr}}</style></head><body><header><nav><a href="index.html" class="logo">Esports</a><ul class="nav-links"><li><a href="index.html">Главная</a></li><li><a href="tournaments.html">Турниры</a></li><li><a href="teams.html">Статистика</a></li><li class="profile-link"><a href="profile.html">Профиль</a></li><li class="login-link"><a href="login.html" class="btn-login">Вход</a></li><li class="logout-link"><a href="#" class="btn-login" onclick="logout();return false;">Выйти</a></li></ul></nav></header><main class="container"><a class="back" href="tournaments.html">← Все турниры</a><section class="hero"><div id="game" class="eyebrow"></div><h1 id="name">Загрузка...</h1><p id="description"></p><span id="status" class="status">—</span></section><div class="info"><div class="item glass"><div class="label">Даты</div><div id="dates" class="value">—</div></div><div class="item glass"><div class="label">Формат</div><div id="format" class="value">—</div></div><div class="item glass"><div class="label">Команды</div><div id="count" class="value">—</div></div><div class="item glass"><div class="label">Состав</div><div id="size" class="value">—</div></div></div><section class="box glass"><h2>Регистрация команд</h2><p id="reg" class="muted"></p><div id="actions" class="actions"></div></section><section class="box glass"><h2>Участники турнира</h2><p class="muted">Только одобренные команды и актуальные составы.</p><div id="teams" class="teams"></div></section></main><footer>© 2026 Esports Platform. Все права защищены.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js"></script><script>const E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),D=v=>v?new Date(v).toLocaleDateString('ru-RU'):'Не задано',SL={registration:'Регистрация',upcoming:'Скоро',ongoing:'Идёт',live:'LIVE',finished:'Завершён',cancelled:'Отменён'};document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return location.replace('tournaments.html');if(id==='dota2-winter-2026')return location.replace(`tournament.html?id=${encodeURIComponent(id)}`);try{const t=await window.EsportsAPI.getTournament(id);if(!t)throw Error('Турнир не найден');if(t.status==='draft')return location.replace(`tournament-draft.html?id=${encodeURIComponent(id)}`);const {data,error}=await window.EsportsAPI.client.rpc('get_public_tournament_teams',{p_tournament_id:id});if(error)throw error;const teams=data||[];document.title=`${t.name} — Esports Platform`;name.textContent=t.name;game.textContent=t.game||'';description.textContent=t.description||'Описание будет добавлено позже.';status.textContent=SL[t.status]||t.status||'—';status.className=`status status-${t.status||''}`;dates.textContent=t.startDate?(t.endDate?`${D(t.startDate)} — ${D(t.endDate)}`:D(t.startDate)):'Не заданы';format.textContent=t.format||'Не задан';count.textContent=t.maxTeams!=null?`${teams.length} / ${t.maxTeams}`:teams.length;size.textContent=t.teamSize?`${t.teamSize} основных${t.maxReserves!=null?` + до ${t.maxReserves} запасных`:''}`:'Не задан';document.getElementById('teams').innerHTML=teams.length?teams.map(x=>{const roster=Array.isArray(x.roster)?x.roster:[];return `<article class="team"><a href="team-public.html?id=${encodeURIComponent(x.team_id)}&tournament=${encodeURIComponent(id)}">${E(x.team_name)}</a><div class="muted">${E(x.region||'')}</div><div class="roster">${roster.map(p=>p.profile_id?`<a class="player" href="player-public.html?id=${encodeURIComponent(p.profile_id)}">${p.roster_position}. ${E(p.display_name)}</a>`:`<span class="player">${p.roster_position}. ${E(p.display_name)}</span>`).join('')}</div></article>`}).join(''):'<div class="muted">Одобренных команд пока нет.</div>';const {data:r,error:re}=await window.EsportsAPI.client.rpc('can_register_for_tournament',{p_tournament_id:id});const row=Array.isArray(r)?r[0]:r;reg.textContent=re?.message||row?.reason||((row?.allowed)?'Регистрация открыта.':'Регистрация закрыта.');actions.innerHTML=(row?.allowed&&row?.mode==='public'?`<a class="btn primary" href="register-team.html?tournament=${encodeURIComponent(id)}">Подать заявку</a>`:'')+`<a class="btn secondary" href="tournament-matches.html?id=${encodeURIComponent(id)}">Матчи и результаты</a><a class="btn secondary" href="tournament-rules.html?id=${encodeURIComponent(id)}">Правила турнира</a>`}catch(e){name.textContent='Не удалось загрузить турнир';description.textContent=e.message;status.style.display='none'}});</script></body></html>
